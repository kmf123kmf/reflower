<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- "Add to Home Screen" opens full screen, without the browser's toolbars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reflower">
<meta name="theme-color" content="#f6f3ec">
<title>Reflower</title>
<style>
:root {
  --pane-w: 760px;
  --font: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --fs: 19px;
  --lh: 1.6;
}
html[data-theme="light"] { color-scheme: light; --bg:#e8e5de; --paper:#fffdf8; --fg:#2b2a27; --muted:#8a857b; --accent:#9a5b2e; --border:#d8d2c6; --ui:#f6f3ec; --shadow:0 2px 18px rgba(0,0,0,.09); }
html[data-theme="sepia"] { color-scheme: light; --bg:#d9ccb2; --paper:#f4ecd8; --fg:#5b4636; --muted:#9a8670; --accent:#8b4513; --border:#d3c3a5; --ui:#ece2cb; --shadow:0 2px 18px rgba(60,40,10,.12); }
html[data-theme="dark"]  { color-scheme: dark; --bg:#111214; --paper:#1c1d20; --fg:#d4d1ca; --muted:#85817a; --accent:#d9a066; --border:#34353a; --ui:#232428; --shadow:0 2px 18px rgba(0,0,0,.5); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }

/* ---------- toolbar ---------- */
#toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--ui); border-bottom: 1px solid var(--border); position: relative; z-index: 20; }
#toolbar .spacer { flex: 1; }
#toolbar button, .panel button, .panel select, #search .sbar button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; cursor: pointer; }
#toolbar button:hover, .panel button:hover, #search .sbar button:hover { background: var(--paper); }
#toolbar button.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
#toolbar button:disabled { opacity: .4; cursor: default; }
/* aria-disabled rather than disabled where the button should still explain itself on hover */
#toolbar button[aria-disabled="true"] { cursor: default; }
#toolbar button[aria-disabled="true"] > svg { opacity: .45; }
#toolbar button.on[aria-disabled="true"] { background: color-mix(in srgb, var(--accent) 45%, var(--ui)); border-color: transparent; }
#layoutSeg svg { display: block; width: 16px; height: 16px; margin: 1px 2px; }
/* Tooltips: data-tip on any element; shown below it after a short hover (or on keyboard focus). */
[data-tip] { position: relative; }
[data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 40; padding: 3px 8px; border-radius: 4px; background: var(--fg); color: var(--paper); font: 12px/1.4 "Segoe UI", system-ui, sans-serif; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; }
[data-tip]:focus-visible::after { opacity: 1; transition-delay: .3s; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: .3s; } } /* touch: a tap would leave it stuck on */
.seg { display: inline-flex; }
.seg button { border-radius: 0 !important; margin-left: -1px; }
.seg button:first-child { border-radius: 5px 0 0 5px !important; margin-left: 0; }
.seg button:last-child { border-radius: 0 5px 5px 0 !important; }
#docname { font-weight: 600; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#indicator { color: var(--muted); min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
#indicator, #pgLabel { cursor: pointer; user-select: none; }
#indicator:hover, #pgLabel:hover { color: var(--fg); }

.panel { position: absolute; top: var(--tb-h, 40px); z-index: 30; background: var(--ui); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; display: none; min-width: 240px; }
.panel.open { display: block; }
.panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 7px 0; }
.panel label:has(input:disabled) { opacity: .45; }
.panel input[type="range"] { width: 130px; }
/* dropdowns in the theme's colours, open list included (the browser draws that, on a light
   background unless told otherwise, which left the dark theme's light text unreadable) */
.panel select { background: var(--paper); }
.panel option, .panel optgroup { background: var(--paper); color: var(--fg); }
.panel h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#settings { right: 10px; }
#exportMenu { right: 120px; min-width: 180px; }
#exportMenu button { display: block; width: 100%; margin: 4px 0; text-align: left; }

/* ---------- stage / pane ---------- */
/* overflow-x is spelled out: left to default it computes to auto (because overflow-y is), and iOS Safari
   then lets the page rubber-band sideways in Scroll layout even though nothing is wider than the screen */
#stage { flex: 1; min-height: 0; position: relative; overflow-x: hidden; overflow-y: auto; overscroll-behavior-x: none; overflow-anchor: none; outline: none; }
/* theme-coloured scrollbars, normal width so the thumb is easy to grab (the stage's is hidden while reading) */
#stage, #searchList, #toc .tbody { scrollbar-color: color-mix(in srgb, var(--muted) 60%, transparent) transparent; }
#pane { position: relative; width: min(var(--pane-w), calc(100% - 24px)); margin: 16px auto; background: var(--paper); box-shadow: var(--shadow); border-radius: 4px; padding: 48px 56px 56px; min-height: calc(100% - 32px); }
.handle { position: absolute; top: 0; bottom: 0; width: 14px; cursor: ew-resize; z-index: 5; touch-action: none; }
.handle.l { left: -7px; } .handle.r { right: -7px; }
.handle::after { content: ""; position: absolute; top: 50%; left: 5px; width: 4px; height: 48px; margin-top: -24px; border-radius: 2px; background: var(--border); opacity: 0; transition: opacity .15s; }
#pane:hover .handle::after, .handle.active::after { opacity: 1; }
#viewport { position: relative; }
#pager { display: none; }

body.paged #stage { overflow: hidden; touch-action: pan-y; } /* sideways drags are ours (swipe to turn); vertical stays the browser's */
body.paged #pane { height: calc(100% - 32px); min-height: 0; display: flex; flex-direction: column; padding: 40px 56px 8px; }
body.paged #viewport { flex: 1; min-height: 0; overflow: hidden; }
body.paged #pager { display: flex; flex: none; height: 32px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; user-select: none; }
#pager button { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 10px; line-height: 1; }
#pager button:hover { color: var(--fg); }
/* scrub bar: app chrome along the bottom of the window, not part of the page. A range
   input over a layer of chapter ticks; the 14px thumb travels 7px in from each end, so ticks and the
   tooltip use the same inset to line up with it. */
#scrubbar { display: none; flex: none; height: 34px; padding: 0 16px; background: var(--ui); border-top: 1px solid var(--border); user-select: none; }
body.has-doc #scrubbar { display: flex; align-items: center; }
body.has-doc #stage { scrollbar-width: none; } /* the scrub bar stands in for the scrollbar while reading */
body.has-doc #stage::-webkit-scrollbar { display: none; }
#scrub { position: relative; flex: 1; height: 100%; }
#scrubRange { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 100%; margin: 0; background: transparent; cursor: pointer; --pct: 0%; }
#scrubRange:focus { outline: none; }
#scrubRange::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--pct), var(--border) var(--pct)); }
#scrubRange::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--accent); }
#scrubRange::-moz-range-track { height: 4px; border-radius: 2px; background: var(--border); }
#scrubRange::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
#scrubRange::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--accent); }
#scrubRange:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
#scrubTicks { position: absolute; left: 7px; right: 7px; top: 50%; height: 0; pointer-events: none; }
#scrubTicks i { position: absolute; top: -7px; width: 1px; height: 4px; background: var(--muted); opacity: .7; }
#scrubTip { position: absolute; bottom: calc(50% + 12px); transform: translateX(-50%); display: none; padding: 3px 8px; border-radius: 4px; background: var(--fg); color: var(--paper); font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 2; }
#scrubTip.show { display: block; }
body.spread #viewport::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid var(--border); opacity: .6; pointer-events: none; }

/* ---------- drop hint ---------- */
#dropHint { text-align: center; color: var(--muted); padding: 12vh 20px; font-family: var(--font); }
#dropHint h1 { font-weight: normal; color: var(--fg); margin: 0 0 .4em; }
#dropHint .box { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; margin-top: 24px; cursor: pointer; }
#dropHint .box:hover { border-color: var(--accent); color: var(--fg); }
#recent { max-width: 460px; margin: 28px auto 0; text-align: left; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; }
#recent h4 { margin: 0 0 6px; font-size: 12px; font-weight: normal; text-transform: uppercase; letter-spacing: .06em; }
#recent .item { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
#recent .item:hover { border-color: var(--accent); }
#recent .open { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: baseline; background: none; border: 0; padding: 9px 12px; font: inherit; color: var(--fg); text-align: left; cursor: pointer; }
#recent .label { flex: 1; min-width: 0; }
#recent .name { overflow-wrap: anywhere; }
#recent .title { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#recent .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
#recent .forget, #recent .forgetAll { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 9px 12px; }
#recent .forget:hover, #recent .forgetAll:hover { color: var(--fg); }
#recent .forgetAll { padding: 2px 0; font-size: 12px; text-decoration: underline; }
body.dragging #pane { outline: 3px dashed var(--accent); outline-offset: 6px; }

/* ---------- reading content ---------- */
#content { font-family: var(--font); font-size: var(--fs); line-height: var(--lh); overflow-wrap: break-word; }
#content p { margin: 0 0 .85em; orphans: 2; widows: 2; }
#content.indent p { margin: 0; }
#content.indent p + p { text-indent: 1.6em; }
#content.justify p { text-align: justify; hyphens: auto; }
#content .doc-title { text-align: center; margin: .3em 0 1.6em; break-inside: avoid; }
#content .doc-title h1 { font-size: 2em; font-weight: normal; line-height: 1.2; margin: 0 0 .25em; letter-spacing: .02em; }
#content .doc-title .subtitle { margin: 0; font-style: italic; text-indent: 0; }
#content .byline { text-align: center; font-style: italic; margin: 0 0 1.4em; break-inside: avoid; }
#content .meta { font-size: .85em; color: var(--muted); border-left: 3px solid var(--border); padding-left: .8em; margin: 0 0 1.2em; break-inside: avoid; }
#content h2.heading { text-align: center; font-size: 1.4em; font-weight: normal; line-height: 1.25; letter-spacing: .03em; margin: 2.2em 0 1.2em; break-after: avoid; break-inside: avoid; }
#content h2.heading.lvl1 { font-size: 1.75em; text-transform: none; }
#content h2.heading .sub { display: block; font-size: .72em; font-style: italic; margin-top: .35em; letter-spacing: 0; }
#content .scene-break { text-align: center; margin: 1.1em 0; color: var(--muted); letter-spacing: .9em; padding-left: .9em; }
#content .verse { margin: .8em 0 1.1em 1.6em; break-inside: avoid; }
#content .verse .vl { text-indent: -1.2em; padding-left: 1.2em; }
#content .center { text-align: center; margin: .8em 0 1.1em; }
#content blockquote { margin: .8em 1.6em 1.1em; }
#content.indent blockquote p + p { text-indent: 1.6em; }
#content pre { font-family: Consolas, "Cascadia Mono", monospace; font-size: .72em; line-height: 1.35; white-space: pre; overflow-x: auto; margin: .8em 0 1.1em; }
#content .note { text-align: center; font-size: .8em; font-style: italic; color: var(--muted); margin: .6em 1.5em 1em; break-inside: avoid; }
#content details.boiler { font-size: .8em; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: .3em .8em; margin: 0 0 1.4em; }
#content details.boiler summary { cursor: pointer; font-family: "Segoe UI", system-ui, sans-serif; }
#content details.boiler h2.heading { font-size: 1.1em; margin: 1em 0 .6em; break-before: auto !important; }
#content :first-child { margin-top: 0; }
body.paged.chapter-breaks #content h2.heading:not(:first-child) { break-before: column; margin-top: 1.2em; }
#endSentinel { height: 1px; }

/* raw view */
#content.raw { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; line-height: 1.45; }
.rl { display: flex; white-space: pre; min-height: 1.45em; }
.rl .ln { flex: none; width: 4.5em; text-align: right; padding-right: 1em; color: var(--muted); opacity: .6; user-select: none; }
.rl .rt { flex: none; }
.rl .rd { flex: none; margin-left: 1em; color: var(--muted); font-size: 11px; user-select: none; display: none; }
body.debug .rl .rd { display: inline; }
body.debug .rl[title] { cursor: help; }

/* ---------- debug overlay ---------- */
[data-kind] { --dc: #4a90d9; }
[data-kind="heading"] { --dc: #c0392b; } [data-kind="title"] { --dc: #8e44ad; } [data-kind="break"] { --dc: #16a085; }
[data-kind="verse"] { --dc: #d35400; } [data-kind="quote"] { --dc: #27ae60; } [data-kind="center"] { --dc: #2c7da0; }
[data-kind="meta"], [data-kind="byline"] { --dc: #7f8c8d; } [data-kind="pre"] { --dc: #b8860b; } [data-kind="note"] { --dc: #9b59b6; } [data-kind="subtitle"] { --dc: #c0392b; }
[data-kind="blank"], [data-kind="collapsed"] { --dc: transparent; }
body.debug #content:not(.raw) [data-kind] { outline: 1px dashed var(--dc); outline-offset: 2px; }
body.debug #content:not(.raw) [data-kind]::before { content: attr(data-kind) " " attr(data-src); display: inline-block; font: 10px/1.3 Consolas, monospace; color: #fff; background: var(--dc); padding: 0 4px; margin-right: 6px; border-radius: 3px; text-indent: 0; letter-spacing: 0; vertical-align: 2px; font-style: normal; }
body.debug .rl { border-left: 4px solid var(--dc); }
body.debug .rl.j-soft .rd { color: #27ae60; } body.debug .rl.j-para .rd { color: #c0392b; } body.debug .rl.j-br .rd { color: #d35400; }
#debugBox { position: fixed; right: 12px; bottom: 12px; z-index: 25; background: var(--ui); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font: 11px/1.5 Consolas, monospace; display: none; max-width: 340px; }
body.debug #debugBox:not(:empty) { display: block; }
#debugBox table { border-collapse: collapse; } #debugBox td { padding: 0 8px 0 0; vertical-align: top; } #debugBox td:first-child { color: var(--muted); white-space: nowrap; }
#debugBox input { width: 60px; font: inherit; }

/* ---------- TOC ---------- */
/* A slide-out on the left, like search on the right: its tab hangs off the drawer's right edge, so
   it shows at the window edge while the drawer is collapsed. Picking a chapter closes it. */
#toc { position: fixed; top: var(--tb-h, 41px); left: 0; bottom: 0; width: 300px; max-width: calc(100% - 28px); z-index: 15; display: flex; flex-direction: column; background: var(--ui); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform .2s ease, box-shadow .2s; }
#toc.open { transform: none; box-shadow: var(--shadow); }
body:not(.has-doc) #toc { display: none; }
#tocTab { position: absolute; left: 100%; top: 14px; width: 28px; padding: 14px 0; writing-mode: vertical-rl; font: inherit; letter-spacing: .08em; color: var(--muted); background: var(--ui); border: 1px solid var(--border); border-left: 0; border-radius: 0 6px 6px 0; cursor: pointer; }
#tocTab:hover, #toc.open #tocTab { color: var(--fg); }
#toc .tbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 0; }
#toc h4 { margin: 0 16px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#toc a { display: block; padding: 5px 16px; color: var(--fg); text-decoration: none; font-family: var(--font); font-size: 14px; }
#toc a:hover { background: var(--paper); }
#toc a.l0 { font-weight: 600; } #toc a.l2 { padding-left: 30px; } #toc a.l3 { padding-left: 44px; }
#toc a small { color: var(--muted); font-style: italic; }
#toc .empty { padding: 5px 16px; color: var(--muted); }

/* ---------- search ---------- */
#search { position: fixed; top: var(--tb-h, 41px); right: 0; bottom: 0; width: 340px; max-width: calc(100% - 28px); z-index: 15; display: flex; flex-direction: column; background: var(--ui); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .2s ease, box-shadow .2s; }
#search.open { transform: none; box-shadow: var(--shadow); }
body:not(.has-doc) #search { display: none; }
/* The tab hangs off the panel's left edge, so it shows at the window edge while the panel is collapsed. */
#searchTab { position: absolute; right: 100%; top: 14px; width: 28px; padding: 14px 0; writing-mode: vertical-rl; font: inherit; letter-spacing: .08em; color: var(--muted); background: var(--ui); border: 1px solid var(--border); border-right: 0; border-radius: 6px 0 0 6px; cursor: pointer; }
#searchTab:hover, #search.open #searchTab { color: var(--fg); }
#search .sbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
body.has-doc #stage, body.has-doc #scrubbar { margin-left: 28px; margin-right: 28px; } /* strips for the Contents and Search tabs, clear of the page */
@media (min-width: 860px) { body.has-doc.search-open #stage, body.has-doc.search-open #scrubbar { margin-right: 368px; } } /* room to spare: dock beside the page */
#search .sbar { display: flex; gap: 4px; padding: 10px 10px 6px; }
#searchInput { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--fg); background: var(--paper); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; }
#searchInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#search .sstatus { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 24px; padding: 0 12px 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#searchBack { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; white-space: nowrap; }
#searchBack:hover { text-decoration: underline; }
#searchList { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--border); }
#searchList .hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border); padding: 7px 12px; color: var(--fg); font: 14px/1.4 var(--font); cursor: pointer; overflow-wrap: anywhere; }
#searchList .hit:hover { background: var(--paper); }
#searchList .hit.cur { background: var(--paper); box-shadow: inset 3px 0 var(--accent); }
#searchList .hit b { color: var(--accent); }
#searchList .where { display: block; margin-top: 2px; font: 11px/1.3 "Segoe UI", system-ui, sans-serif; color: var(--muted); }

::highlight(search) { background-color: rgba(255, 196, 0, .4); }
::highlight(search-cur) { background-color: #ff9632; color: #000; }
html[data-theme="dark"] ::highlight(search) { background-color: rgba(217, 160, 102, .3); }
html[data-theme="dark"] ::highlight(search-cur) { background-color: #d9a066; color: #111; }

/* ---------- compact (phones) ---------- */
/* Below 700px the page takes the full width, Contents/Search move into the toolbar, and desktop-only
   controls (Spread, Raw, Debug, file name, indicator, resize handles) are hidden. The JS side uses the
   same breakpoint (compactMQ) to treat a saved Spread as Page. */
.compact-only { display: none; }
#toolbar .tbicon svg, #toolbar .phone-icon { display: block; width: 16px; height: 16px; margin: 1px 2px; }
#toolbar .phone-icon { display: none; }
.touch-hint { display: none; }
@media (hover: none) and (pointer: coarse) { .touch-hint { display: inline; } .mouse-hint { display: none; } }
@media (max-width: 700px) {
  #toolbar { gap: 4px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; }
  #toolbar::-webkit-scrollbar { display: none; }
  #toolbar > * { flex: none; }
  #toolbar button { padding: 6px 8px; }
  #toolbar .spacer { flex: 1; min-width: 0; }
  #docname, #viewSeg, #btnDebug, #indicator, #layoutSeg [data-layout="spread"], #tocTab, #searchTab, .handle { display: none; }
  #layoutSeg [data-layout="page"] { border-radius: 0 5px 5px 0 !important; }
  #btnSettings { order: 1; } #btnExport { order: 2; } /* if the bar must scroll, Aa stays in view first */
  #toolbar .phone-icon { display: block; } #toolbar .wide-label { display: none; }
  body.has-doc .compact-only { display: inline-block; }
  body.has-doc #stage, body.has-doc #scrubbar { margin-left: 0; margin-right: 0; }
  #pane { width: 100%; margin: 0; border-radius: 0; box-shadow: none; padding: 20px 18px 32px; min-height: 100%; }
  body.paged #pane { height: 100%; padding: 16px 18px 0; }
  .panel { left: 8px; right: 8px !important; min-width: 0; max-height: calc(100% - var(--tb-h, 40px) - 8px); overflow-y: auto; }
  .panel input[type="range"] { width: auto; flex: 1; max-width: 180px; }
  #toc, #search { width: 100%; max-width: none; }
  /* Search is a sheet under the toolbar and the page lays itself out in the space below it, so a tapped
     result shows in context. At the top rather than the bottom: the on-screen keyboard covers the bottom. */
  body { --sheet-h: min(42vh, 380px); }
  #search { bottom: auto; height: var(--sheet-h); border-left: 0; border-bottom: 1px solid var(--border); transform: none; opacity: 0; visibility: hidden; transition: opacity .15s, visibility 0s .15s; }
  #search.open { opacity: 1; visibility: visible; transition: opacity .15s; }
  body.has-doc.search-open #stage { margin-top: var(--sheet-h); }
  #searchList .hit { touch-action: manipulation; } /* double tap closes the sheet rather than zooming */
  #searchInput { font-size: 16px; } /* smaller text makes iOS zoom the page on focus */
  #dropHint { padding: 6vh 4px; }
  #dropHint .box { padding: 28px 16px; }
}
@media (max-width: 380px) {
  #toolbar { gap: 3px; padding: 6px 4px; }
  #toolbar button { padding: 6px 5px; }
  #layoutSeg svg, #toolbar .tbicon svg { margin: 1px 0; }
}

/* ---------- auto-hiding bars (phones, portrait or landscape: body.autohide, set from autoMQ) ---------- */
/* While a book is open the toolbar and scrub bar float over the text instead of taking space from
   it, so hiding or showing them never re-lays out the book (page breaks stay put). Hidden bars slide
   off screen but stay focusable: keyboard / VoiceOver focus brings them back. */
#progLine { display: none; }
body.autohide { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
body.autohide.has-doc #stage { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
body.autohide.has-doc #toolbar { position: fixed; top: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); padding-top: max(6px, env(safe-area-inset-top)); box-shadow: var(--shadow); transition: transform .2s ease, opacity .2s, box-shadow .2s; }
body.autohide.has-doc #scrubbar { position: fixed; bottom: 0; left: env(safe-area-inset-left); right: env(safe-area-inset-right); z-index: 14; height: calc(34px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); transition: transform .2s ease, opacity .2s; }
body.autohide.has-doc.chrome-hidden #toolbar { transform: translateY(-100%); box-shadow: none; pointer-events: none; }
body.autohide.has-doc.chrome-hidden #scrubbar { transform: translateY(100%); pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  body.autohide.has-doc #toolbar, body.autohide.has-doc #scrubbar { transition: opacity .15s; }
  body.autohide.has-doc.chrome-hidden #toolbar, body.autohide.has-doc.chrome-hidden #scrubbar { transform: none; opacity: 0; }
}
@media (max-width: 700px) { body.autohide.has-doc.search-open #stage { margin-top: calc(var(--tb-h, 41px) + var(--sheet-h)); } } /* the sheet hangs below the floating toolbar */
/* where you are, while the bars are hidden */
body.autohide.has-doc.chrome-hidden #progLine { display: block; position: fixed; left: 0; bottom: env(safe-area-inset-bottom); height: 2px; background: var(--accent); opacity: .6; z-index: 14; pointer-events: none; }
/* one-time tip, the first time the bars hide */
#chromeHint { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 18px; background: var(--fg); color: var(--paper); font-size: 13px; text-align: center; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .3s; }
#chromeHint.show { opacity: .92; }
</style>

<!-- ======================================================================
     Reflow engine: pure functions, no DOM access.
     ====================================================================== -->
<script id="reflow-engine">
const Reflow = (() => {
  'use strict';

  /* ---------------- patterns ---------------- */
  const NUMWORDS = 'one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last|final';
  const NUM = `(?:\\d{1,4}[a-z]?|[ivxlcdm]{1,8}|${NUMWORDS})`;
  const CHAPTER_RE = new RegExp(`^(?:chapter|chap\\.|ch\\.|part|book|volume|vol\\.|section|act|scene|canto|episode|letter)(?:\\s+|(?<=\\.)\\s*)${NUM}(?:[\\s-]+${NUM})*(?=$|[\\s.:\\-—–)])[.:)]?\\s*(?:[-—–:|]\\s*)?(.*)$`, 'i');
  const PART_RE = /^(?:part|book|volume|vol\.|act)\b/i;
  const NAMED_RE = /^(?:prologue|epilogue|interlude|intermission|afterword|foreword|preface|introduction|dedication|acknowledg(?:e)?ments|contents|table of contents|author'?s note|appendix(?:\s+[a-z0-9]+)?|glossary|postscript|coda|the end|fin|finis)(?=$|[\s.:\-—–])[.:]?\s*(?:[-—–:|]\s*)?(.*)$/i;
  const END_RE = /^(?:the\s+)?end(?:\s+of)?(?:\s+(?:part|chapter|book|volume|section|story)\b.*)?[\s.!?]*$/i;
  const NUMERAL_RE = /^[\[(~\-#*=\s.]*(?:\d{1,3}|[IVXLCDM]{1,7})[\])~\-#*=\s.:]*$/;
  const OOO_RE = /^[\s\-~=*]*(?:o\s*O\s*o|O\s*o\s*O|x\s*X\s*x|X\s*x\s*X)[\s\-~=*]*$/;
  const LIST_RE = /^(?:[-*+•–]\s+\S|\(?\d{1,3}[.)]\s+\S|\(?[a-z][.)]\s+\S)/;
  const META_RE = /^[A-Z][A-Za-z0-9 '\/&-]{0,24}:\s+\S/;
  const NOTE_RE = /^\[(?:Illustration|Footnote|Sidenote|Transcriber|Editor|Note|Image|Picture|Pg\.?\s*\d)/i;
  const PG_START_RE = /^\*{3}\s*START OF (?:THE|THIS) PROJECT GUTENBERG/i;
  const PG_END_RE = /^\*{3}\s*END OF (?:THE|THIS) PROJECT GUTENBERG/i;
  const ABBREV_RE = /(?:^|[\s(“"'])(?:Mr|Mrs|Ms|Mx|Dr|St|Jr|Sr|Prof|Capt|Col|Gen|Lt|Sgt|Rev|Hon|Mt|Messrs|Mme|Mlle|Fr|Gov|Pres|vs|cf|viz|[A-Z])\.$/;
  const FRONT_RE = /^(?:by|written by|story by|copyright|©|\(c\)|translated|edited|illustrated|a novel|a story|a short story|an? \w+ (?:story|novel|tale))\b/i;
  const END_W = { terminal: -1.5, colon: -0.5, comma: 1, word: 1.5, hyphen: 2, dash: 0.5, other: 0 };
  const START_W = { lower: 2, quote: -0.5, upper: 0, digit: 0, other: 0 };

  /* ---------------- small helpers ---------------- */
  const firstWordLen = t => (t.match(/^\S+/) || [''])[0].length;
  const bandOf = W => Math.max(8, Math.round(W * 0.22));
  const isRuleLike = t => t.length >= 3 && /^([-=_~*#+.])\1+$/.test(t.replace(/\s+/g, ''));
  const isBreakLine = t => t.length > 0 && t.length <= 60 && (!/[\p{L}\p{N}"“”'‘’?!()\[\]]/u.test(t) || OOO_RE.test(t));

  function endType(t) {
    if (/\p{L}-$/u.test(t)) return 'hyphen';
    const s = t.replace(/[\s"'”’»)\]_*]+$/, '');
    if (/(?:--|—|–)$/.test(s)) return 'dash';
    if (/[.!?…]$/.test(s)) return ABBREV_RE.test(s) ? 'word' : 'terminal';
    if (/:$/.test(s)) return 'colon';
    if (/[,;]$/.test(s)) return 'comma';
    if (/[\p{L}\p{N}]$/u.test(s)) return 'word';
    return 'other';
  }

  function startType(t) {
    const c = t[0];
    if ('"“‘«„—'.includes(c) || t.startsWith('--')) return 'quote';
    if (c === "'") return /^'(?:em|tis|twas|cause|til|n|bout|round|kay)\b/i.test(t) ? 'lower' : 'quote';
    const m = t.match(/[\p{L}\p{N}]/u);
    if (!m) return 'other';
    const ch = m[0];
    if (/\p{N}/u.test(ch)) return 'digit';
    if (ch !== ch.toUpperCase()) return 'lower';
    if (ch !== ch.toLowerCase()) return 'upper';
    return 'other';
  }

  function allCaps(t) {
    const letters = t.match(/\p{L}/gu);
    if (!letters || letters.length < 3) return false;
    return letters.filter(c => c !== c.toLowerCase()).length / letters.length >= 0.9;
  }

  function titleCase(t) {
    const words = t.split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}]+/u, '')).filter(w => /\p{L}/u.test(w));
    if (!words.length || words.length > 10) return false;
    const cap = w => w[0] !== w[0].toLowerCase() || /^\p{N}/u.test(w);
    if (!cap(words[0])) return false;
    const sig = words.filter(w => w.length >= 4);
    return !sig.length || sig.filter(cap).length / sig.length >= 0.75;
  }

  // paraIndent: the usual first-line indent. A line starting there and running most of the way across
  // is a one-line paragraph, however evenly its margins happen to come out.
  function isCentered(l, W, paraIndent = 0) {
    if (!W) return l.indent >= 6 && l.text.length < 60;
    if (paraIndent && Math.abs(l.indent - paraIndent) <= 1 && l.len >= W * 0.8) return false;
    return l.indent >= 3 && l.len < W - 4 && Math.abs(l.indent - (W - l.len)) <= Math.max(3, Math.round(W * 0.08));
  }

  function expandTabs(s) {
    if (!s.includes('\t')) return s;
    let out = '';
    for (const ch of s) out += ch === '\t' ? ' '.repeat(8 - (out.length % 8)) : ch;
    return out;
  }

  function percentileDesc(arr, p) {
    const s = [...arr].sort((a, b) => b - a);
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  }

  function mode(arr, dflt = 0) {
    const m = new Map();
    let best = dflt, bc = 0;
    for (const v of arr) { const c = (m.get(v) || 0) + 1; m.set(v, c); if (c > bc) { bc = c; best = v; } }
    return best;
  }

  /* ---------------- pass 0: normalise ---------------- */
  function normalize(text) {
    text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').replace(/[\f\v]/g, '\n')
      .replace(/\u00A0/g, ' ').replace(/[\u0000-\u0008\u000E-\u001F\u007F]/g, '');
    const rows = text.split('\n');
    if (rows.length && rows[rows.length - 1] === '') rows.pop();
    return rows.map((raw, i) => {
      const r = expandTabs(raw).replace(/\s+$/, '');
      const t = r.trimStart();
      return { i, raw, text: t, indent: r.length - t.length, len: r.length, blank: !t.length, ts: !!t.length && /[ \t]$/.test(raw) };
    });
  }

  /* ---------------- width estimation ---------------- */
  // Pick L maximising (#lines with length in (L-10, L]) - (#lines longer than L):
  // hard-wrapped text piles up just under the wrap column and almost never exceeds it.
  function estimateWidth(lens) {
    if (lens.length < 3) return null;
    const max = Math.min(400, Math.max(...lens));
    if (max < 20) return null;
    const hist = new Array(max + 2).fill(0);
    let over400 = 0;
    for (const l of lens) l > max ? over400++ : hist[l]++;
    const cum = new Array(max + 2).fill(0);
    for (let k = 1; k <= max + 1; k++) cum[k] = cum[k - 1] + (hist[k] || 0);
    const n = lens.length;
    let best = -Infinity, bestL = null;
    for (let L = 20; L <= max; L++) {
      const score = (cum[L] - cum[Math.max(0, L - 10)]) - (n - cum[L]);
      if (score > best) { best = score; bestL = L; }
    }
    return bestL;
  }

  function nearFrac(lines, W) {
    if (!lines.length || !W) return 0;
    const band = bandOf(W);
    return lines.filter(l => l.len >= W - band && l.len <= W + 2).length / lines.length;
  }

  /* ---------------- pass 1: double spacing ---------------- */
  function detectDoubleSpacing(lines) {
    if (lines.filter(l => !l.blank).length < 8) return false;
    // Double-spaced files almost never have two adjacent non-blank lines, and the lines
    // followed by exactly one blank cluster near a wrap width (they are wrapped interior lines).
    let pairs = 0, single = 0, adjacent = 0;
    const cand = [];
    for (let k = 0; k < lines.length; k++) {
      if (lines[k].blank) continue;
      let j = k + 1;
      while (j < lines.length && lines[j].blank) j++;
      if (j >= lines.length) continue;
      pairs++;
      if (j === k + 1) adjacent++;
      if (j - k === 2) { single++; if (lines[k].len >= 20) cand.push(lines[k]); }
    }
    if (!pairs || adjacent / pairs > 0.1 || single / pairs < 0.4) return false;
    const W = estimateWidth(cand.map(l => l.len));
    return !!W && W <= 250 && nearFrac(cand, W) >= 0.5;
  }

  function toBlocks(lines) {
    const blocks = [];
    let cur = null, blanks = 0;
    for (const l of lines) {
      if (l.blank) { if (cur) { blocks.push(cur); cur = null; } blanks++; continue; }
      if (!cur) { cur = { lines: [], before: blanks }; blanks = 0; }
      cur.lines.push(l);
    }
    if (cur) blocks.push(cur);
    blocks.forEach((b, k) => { b.after = blocks[k + 1] ? blocks[k + 1].before : blanks; });
    return blocks;
  }

  /* ---------------- block classifiers ---------------- */
  function mkHeading(t, rest, level) {
    rest = (rest || '').trim();
    if (/[,;]$/.test(rest) || rest.length > 60) return null;
    const label = t.slice(0, t.length - rest.length).replace(/[\s.:\-—–|]+$/, '').trim();
    return { label, sub: rest, level };
  }

  function matchHeading(t) {
    if (t.length > 80) return null;
    let m;
    if ((m = t.match(CHAPTER_RE))) return mkHeading(t, m[1], PART_RE.test(t) ? 1 : 2);
    if ((m = t.match(NAMED_RE))) return mkHeading(t, m[1], 2);
    if (NUMERAL_RE.test(t)) return { label: t.replace(/^[\[(~\-#*=\s.]+|[\])~\-#*=\s.:]+$/g, ''), sub: '', level: 2, numeral: true };
    return null;
  }

  const isMetaBlock = b => {
    const hits = b.lines.filter(l => META_RE.test(l.text)).length;
    return hits >= 2 && hits / b.lines.length >= 0.6;
  };

  function headingOf(b, ctx) {
    const content = b.lines.filter(l => !isRuleLike(l.text));
    if (!content.length || content.length > 3) return null;
    const W = ctx.W, shortMax = W ? Math.min(70, Math.max(30, W * 0.8)) : 70;
    if (content.some(l => l.text.length > shortMax)) return null;
    const decorated = content.length < b.lines.length;
    const t0 = content[0].text, rest = content.slice(1).map(l => l.text);
    const noEnd = t => !/[.,;:]$/.test(t.replace(/[\s"'”’)*_]+$/, '')) || /^\p{Lu}+\.$/u.test(t);
    const h = matchHeading(t0);
    if (h) {
      if (rest.length && !h.sub) h.sub = rest.join(' — ');
      else if (rest.length) h.sub += ' — ' + rest.join(' — ');
      return h;
    }
    // From here on it is layout alone (decoration, capitals, centring): `weak`, see demoteStrayHeadings.
    // A line starting in lower case ("(the PA system)") reads as text, not a title.
    if (/^["“‘'(]/.test(t0) || content.some(l => /^[^\p{L}\p{N}]*\p{Ll}/u.test(l.text))) return null;
    // Nor do end markers ("END PART ONE", "THE END???") or file names ("SSY-02.TXT", left by joining parts).
    if (END_RE.test(t0) || /^[\w-]+\.[a-z\d]{2,4}$/i.test(t0)) return null;
    const label = t0, sub = rest.join(' — ');
    if (decorated && content.length === 1) return { label, sub, level: 2, weak: true };
    if (content.every(l => allCaps(l.text)) && content.every(l => noEnd(l.text)) && !/[!?]$/.test(t0)) return { label, sub, level: 2, weak: true };
    if (ctx.wrapped && content.every(l => isCentered(l, W, ctx.paraIndent)) && content.every(l => noEnd(l.text))) return { label, sub, level: 2, weak: true };
    return null;
  }

  // A heading found by layout alone is a guess. Where the chapters are found by name or number
  // ("Chapter 3", "IV") and such guesses are the odd one out, they are more likely a sign, a notice
  // or an announcement in the story: shown centred, kept out of the contents.
  function demoteStrayHeadings(items) {
    const hs = items.filter(it => it.type === 'heading'), weak = hs.filter(it => it.weak).length;
    if (!weak || hs.length - weak < 3 * weak) return;
    for (let k = items.length - 1; k >= 0; k--) {
      const it = items[k];
      if (it.type !== 'heading' || !it.weak) continue;
      items.splice(k, 1, { type: 'center', lines: it.lines }, ...(it.subLines.length ? [{ type: 'center', lines: it.subLines }] : []));
    }
  }

  // A serial's header for each part: a centred block (title, "(PART TWO)", byline, address) with one
  // part or chapter line in it, which becomes the heading.
  function partHeader(b, ctx) {
    if (!ctx.wrapped || b.lines.length < 2 || b.lines.length > 5 || !b.lines.every(l => isCentered(l, ctx.W, ctx.paraIndent))) return null;
    const hits = b.lines.map(l => l.text.replace(/^[(\[]\s*|\s*[)\]]$/g, '')).filter(t => t.length <= 40 && CHAPTER_RE.test(t));
    if (hits.length !== 1) return null;
    return { type: 'heading', label: hits[0], sub: '', level: PART_RE.test(hits[0]) ? 1 : 2, lines: b.lines, subLines: [] };
  }

  function isSubtitleBlock(b, ctx) {
    if (b.note || b.lines.length > 2) return false;
    const ts = b.lines.map(l => l.text);
    if (ts.some(t => t.length > 60 || /[.,;:]$/.test(t) || /^["“‘'(]/.test(t) || isBreakLine(t) || /^(?:[IVXLCDM]+|\d+)[.)]\s/.test(t))) return false;
    if (matchHeading(ts[0])) return false;
    return ts.every(t => titleCase(t) || allCaps(t) || /^[_*].*[_*]$/.test(t)) || b.lines.every(l => isCentered(l, ctx.W, ctx.paraIndent));
  }

  function isTitleBlock(b) {
    const ts = b.lines.map(l => l.text);
    if (ts.length > 4 || ts.some(t => t.length > 70)) return false;
    if (isMetaBlock(b) || isBreakLine(ts[0]) || /^["“‘'(]/.test(ts[0])) return false;
    const last = ts[ts.length - 1].replace(/[\s"'”’)*_]+$/, '');
    return !/[.,;:]$/.test(last) || allCaps(last);
  }

  function frontKind(b, ctx) {
    const ts = b.lines.map(l => l.text);
    if (ts.length > 4 || ts.some(t => t.length > 70) || matchHeading(ts[0])) return null;
    if (isMetaBlock(b)) return 'meta';
    if (FRONT_RE.test(ts[0])) return 'byline';
    if (ts.every(t => t.length <= 50 && !/[.,;:!?]$/.test(t)) &&
        b.lines.every(l => allCaps(l.text) || titleCase(l.text) || isCentered(l, ctx.W, ctx.paraIndent))) return 'byline';
    return null;
  }

  function isPreBlock(b, W) {
    if (b.lines.length < 2) return false;
    const L = b.lines.filter(l => !isRuleLike(l.text)); // a rule under a line is decoration, not a table
    if (!L.length) return false;
    let hits = 0;
    for (const l of L) {
      const t = l.text, dense = t.replace(/\s/g, '').length || 1;
      const sym = (t.match(/[|+_=\/\\<>{}\[\]#*~^`@$%\u2500-\u257F\u2580-\u259F]/g) || []).length;
      const gaps = (t.match(/\S {3,}(?=\S)/g) || []).length;
      const atWidth = W && l.len >= W - 1;
      if (sym / dense > 0.3 || (!atWidth && (gaps >= 2 || /\S {5,}\S/.test(t)))) hits++;
    }
    return hits / L.length >= 0.5;
  }

  /* ---------------- join decision ---------------- */
  function decide(a, b, prev, sec, ctx) {
    const reasons = [];
    let s = 0, room = null, fitSoft = false;
    const et = endType(a.text), st = startType(b.text);
    const list = LIST_RE.test(b.text);
    const indentUp = b.indent > a.indent;
    const indentDownEnd = !!(prev && prev.dec && prev.dec.join && prev.indent === a.indent && a.indent > b.indent);
    const W = sec.W;
    if (!sec.wrapped) { s = -10; reasons.push('section is not hard-wrapped'); }
    else {
      if (ctx.flowed) {
        if (a.ts) { s += 3; reasons.push('trailing space (format=flowed)'); }
        else { s -= 3; reasons.push('no trailing space (format=flowed)'); }
      }
      room = W - (a.len + 1 + firstWordLen(b.text));
      if (a.len > W + ctx.slop) { s -= 2; reasons.push(`longer than width ${W}`); }
      else if (ctx.ragged && sec.rmin) {
        // ragged margins: any length inside the ragged band is uninformative
        if (a.len >= sec.rmin) { s -= 0.25; reasons.push(`inside ragged margin (${sec.rmin}–${W})`); }
        else { s -= 1 + (sec.rmin - a.len) / 5; reasons.push(`short of ragged margin ${sec.rmin}`); }
      }
      else if (room < 0) { s += 3; fitSoft = true; reasons.push(`next word would not fit (+${-room})`); }
      else if (room <= ctx.slop) { s += 1; reasons.push(`at width (room ${room})`); }
      else { s -= 2 + Math.min(room, 30) / 6; reasons.push(`next word fits (room ${room})`); }
      if (END_W[et]) { s += END_W[et]; reasons.push(`ends ${et}`); }
      if (START_W[st]) { s += START_W[st]; reasons.push(`next starts ${st}`); }
      if (et === 'terminal' && st === 'quote') { s -= 1; reasons.push('sentence end + opening quote'); }
      else if (ctx.blankSeparated) { s += 2; reasons.push('inside blank-separated block'); }
      if (list) { s -= 3; reasons.push('list item'); }
      if (indentUp) { s -= 4; reasons.push('indent increases'); }
      else if (indentDownEnd) { s -= 3; reasons.push('indented block ends'); }
    }
    const join = s > 0;
    let type = 'soft';
    if (!join) type = (!ctx.blankSeparated || et === 'terminal' || st === 'quote' || indentUp || list || indentDownEnd) ? 'para' : 'br';
    return { join, type, score: Math.round(s * 10) / 10, reasons, fitSoft: join && fitSoft, room, et, st };
  }

  function buildDict(text) {
    const words = new Set(), hyph = new Set();
    for (const m of text.matchAll(/\p{L}+(?:[-'’]\p{L}+)*/gu)) {
      const w = m[0].toLowerCase();
      (w.includes('-') ? hyph : words).add(w);
    }
    return { words, hyph };
  }

  function joinText(acc, a, b, ctx) {
    if (a.dec.et === 'hyphen') {
      const left = (acc.match(/(\p{L}+)-$/u) || [])[1], right = (b.text.match(/^\p{L}+/u) || [])[0];
      if (left && right) {
        const lw = (left + right).toLowerCase();
        if (!ctx.dict.hyph.has(`${left}-${right}`.toLowerCase()) && ctx.dict.words.has(lw)) return acc.slice(0, -1) + b.text;
      }
      return acc + b.text;
    }
    if (/(?:--|—|–)$/.test(acc)) return /\s(?:--|—|–)$/.test(acc) ? `${acc} ${b.text}` : acc + b.text;
    return `${acc} ${b.text}`;
  }

  /* ---------------- main analysis ---------------- */
  function analyze(input, opts = {}) {
    const orig = normalize(input || '');
    const info = orig.map(l => ({ kind: l.blank ? 'blank' : 'prose', join: null, score: null, reasons: null, W: null }));
    const stats = { lines: orig.length, passes: [] };
    const mark = (lines, kind) => lines.forEach(l => { info[l.i].kind = kind; });

    // Pass 1: double spacing
    let work = orig;
    stats.doubleSpaced = detectDoubleSpacing(orig);
    if (stats.doubleSpaced) {
      work = [];
      for (let k = 0; k < orig.length; k++) {
        if (!orig[k].blank) { work.push(orig[k]); continue; }
        let j = k;
        while (j < orig.length && orig[j].blank) j++;
        if (j - k >= 2) work.push(orig[k]);
        for (let q = j - k >= 2 ? k + 1 : k; q < j; q++) info[q].kind = 'collapsed';
        k = j - 1;
      }
      stats.passes.push('collapsed double spacing');
    }

    // Pass 2: blocks (bracketed [Illustration: ...] notes may span blank lines) + global width
    const blocks = [];
    for (const b of toBlocks(work)) {
      const prev = blocks[blocks.length - 1];
      if (prev && prev.note && !prev.closed && prev.lines.length < 40) {
        prev.lines.push(...b.lines);
        prev.closed = /\]\s*$/.test(b.lines[b.lines.length - 1].text);
        prev.after = b.after;
        continue;
      }
      if (NOTE_RE.test(b.lines[0].text)) { b.note = true; b.closed = /\]\s*$/.test(b.lines[b.lines.length - 1].text); }
      blocks.push(b);
    }
    const interior = [];
    blocks.forEach(b => b.lines.slice(0, -1).forEach(l => { if (!isBreakLine(l.text)) interior.push(l); }));
    let W = estimateWidth(interior.filter(l => l.len >= 20).map(l => l.len));
    const conf = nearFrac(interior, W);
    let wrapped = !!W && W <= 250 && interior.length >= 3 && conf >= 0.5;
    if (opts.width) { W = opts.width; wrapped = true; }
    stats.width = W; stats.confidence = Math.round(conf * 100); stats.wrapped = wrapped;
    stats.passes.push(`global width ${W ?? '—'} (${stats.confidence}% of interior lines near it)`);

    const nonBlank = work.filter(l => !l.blank).length;
    // first-line indents inside blocks mean paragraphs are marked by indentation, not blank lines
    let indentStarts = 0;
    blocks.forEach(b => b.lines.forEach((l, j) => {
      const p = b.lines[j - 1], n = b.lines[j + 1];
      if (p && l.indent > p.indent && l.indent <= 10 && (!n || n.indent < l.indent || endType(l.text) === 'terminal')) indentStarts++;
    }));
    const ctx = {
      W: wrapped ? W : null, wrapped, slop: 2, flowed: false, ragged: false,
      blankSeparated: blocks.length > 0 && nonBlank / blocks.length <= 12 && !(indentStarts >= 3 && indentStarts >= blocks.length * 0.5),
      dict: buildDict(input || ''),
    };
    if (wrapped) {
      const band = bandOf(W);
      const near = interior.filter(l => l.len >= W - band && l.len <= W + 2);
      const lastTs = blocks.filter(b => b.lines[b.lines.length - 1].ts).length / (blocks.length || 1);
      ctx.flowed = near.length >= 5 && near.filter(l => l.ts).length / near.length >= 0.7 && lastTs <= 0.3;
      if (ctx.flowed) stats.passes.push('format=flowed trailing spaces detected');
    }
    const contLines = [];
    blocks.forEach(b => { if (b.lines.length >= 3) b.lines.slice(1).forEach(l => contLines.push(l.indent)); });
    ctx.bodyIndent = mode(contLines, 0);
    ctx.paraIndent = mode(blocks.filter(b => b.lines.length >= 2 && b.lines[0].indent > ctx.bodyIndent).map(b => b.lines[0].indent), 0);
    stats.blankSeparated = ctx.blankSeparated; stats.flowed = ctx.flowed;

    // Pass 3: block classification (front matter, headings, breaks, preformatted, prose)
    const items = [];
    let k = 0;
    // the title is the first block of the file, or the first block after a Gutenberg START marker
    const pgStartLine = orig.findIndex(l => PG_START_RE.test(l.text));
    const titleIdx = pgStartLine < 0 ? 0 : blocks.findIndex(b => b.lines[0].i > pgStartLine);
    for (; k < blocks.length; k++) {
      const b = blocks[k];
      if (k === titleIdx && titleIdx >= 0 && k < blocks.length - 1 && !matchHeading(b.lines[0].text)) {
        const t = isMetaBlock(b) ? 'meta' : isTitleBlock(b) ? 'title' : null;
        if (t) {
          items.push({ type: t, lines: b.lines });
          let fk;
          while (k + 1 < blocks.length - 1 && k - titleIdx < 5 && (fk = frontKind(blocks[k + 1], ctx))) { k++; items.push({ type: fk, lines: blocks[k].lines }); }
          continue;
        }
      }
      if (b.note) { items.push({ type: 'note', lines: b.lines }); continue; }
      if (b.lines.every(l => isBreakLine(l.text))) { items.push({ type: 'break', lines: b.lines }); continue; }
      // structural hints from a rich-text source (e.g. RTF heading styles / centred paragraphs)
      const hk = opts.hints && b.lines.every(l => opts.hints[l.i]) ? opts.hints[b.lines[0].i] : null;
      if (hk === 'center' || hk === 'verse') { items.push({ type: hk, lines: b.lines }); continue; }
      if (hk === 'heading') {
        const t0 = b.lines[0].text, rest = b.lines.slice(1).map(l => l.text).join(' — ');
        const hh = matchHeading(t0) || { label: t0, sub: '', level: 2 };
        const it = { type: 'heading', ...hh, sub: [hh.sub, rest].filter(Boolean).join(' — '), lines: b.lines, subLines: [] };
        const nb = blocks[k + 1];
        if (!it.sub && matchHeading(t0) && nb && nb.lines.length <= 2 && nb.lines.every(l => opts.hints[l.i] === 'heading')) {
          k++; it.sub = nb.lines.map(l => l.text).join(' — '); it.subLines = nb.lines;
        }
        items.push(it);
        continue;
      }
      const ph = partHeader(b, ctx);
      if (ph) { items.push(ph); continue; }
      const h = headingOf(b, ctx);
      if (h && !(h.numeral && b.lines.length > 1)) {
        const it = { type: 'heading', ...h, lines: [...b.lines], subLines: [] };
        if (!h.sub && !/contents/i.test(h.label) && k + 1 < blocks.length - 1 && isSubtitleBlock(blocks[k + 1], ctx)) {
          k++;
          it.sub = blocks[k].lines.map(l => l.text).join(' — ');
          it.subLines = blocks[k].lines;
        }
        items.push(it);
        continue;
      }
      if (isMetaBlock(b)) { items.push({ type: 'meta', lines: b.lines }); continue; }
      if (isPreBlock(b, ctx.W)) { items.push({ type: 'pre', lines: b.lines }); continue; }
      // prose block: split out in-block scene breaks / strict chapter headings
      let run = [];
      const flush = () => { if (run.length) items.push({ type: 'prose', lines: run, whole: run.length === b.lines.length }); run = []; };
      b.lines.forEach((l, j) => {
        const prev = b.lines[j - 1];
        if (b.lines.length > 1 && isBreakLine(l.text)) { flush(); items.push({ type: 'break', lines: [l] }); return; }
        if (b.lines.length > 1 && (!ctx.W || l.len < ctx.W * 0.75) && l.text.length <= 60) {
          const hh = matchHeading(l.text);
          if (hh && !hh.numeral && (!hh.sub || titleCase(hh.sub) || allCaps(hh.sub)) &&
              (!prev || endType(prev.text) === 'terminal' || isBreakLine(prev.text))) {
            flush(); items.push({ type: 'heading', ...hh, lines: [l], subLines: [] }); return;
          }
        }
        run.push(l);
      });
      flush();
    }
    demoteStrayHeadings(items);
    stats.passes.push('classified blocks');

    // Pass 4: sections (split at headings) with local width estimates
    const secs = [{ W: ctx.W, wrapped, lines: [] }];
    for (const it of items) {
      if (it.type === 'heading' || it.type === 'title') secs.push({ W: ctx.W, wrapped, lines: [] });
      if (it.type === 'prose') it.lines.forEach(l => { l.sec = secs.length - 1; secs[secs.length - 1].lines.push(l); });
      it.sec = secs.length - 1;
    }
    const proseItems = items.filter(it => it.type === 'prose');
    if (!opts.width) {
      for (const sec of secs) {
        const ints = [];
        proseItems.forEach(it => { if (secs[it.sec] === sec) it.lines.slice(0, -1).forEach(l => ints.push(l)); });
        const lens = ints.filter(l => l.len >= 20).map(l => l.len);
        if (lens.length < 12) continue;
        const est = estimateWidth(lens), lc = nearFrac(ints, est);
        if (!est || est > 250 || lc < 0.6) continue;
        if (wrapped && Math.abs(est - ctx.W) >= 4) sec.W = est;
        else if (!wrapped && lens.length >= 20) { sec.W = est; sec.wrapped = true; }
      }
      const local = secs.filter(s => s.lines.length && s.W !== ctx.W).length;
      if (local) stats.passes.push(`${local} section(s) use a local width`);
    }

    // Pass 5..n: decide joins, refine widths from the joined lines, repeat until stable
    const runDecisions = () => {
      for (const it of proseItems) {
        const L = it.lines;
        for (let j = 0; j < L.length; j++) L[j].dec = j < L.length - 1 ? decide(L[j], L[j + 1], L[j - 1], secs[L[j].sec], ctx) : null;
      }
    };
    let iter = 0;
    for (; iter < 6; iter++) {
      runDecisions();
      if (opts.width) break;
      let changed = false;
      if (iter === 0 && !ctx.ragged) {
        let pairs = 0, mid = 0;
        for (const it of proseItems) for (const l of it.lines) {
          if (!l.dec || !secs[l.sec].wrapped) continue;
          pairs++;
          if (l.dec.room > ctx.slop && (l.dec.et === 'word' || l.dec.et === 'comma') && l.dec.st === 'lower') mid++;
        }
        if (pairs >= 10 && mid / pairs >= 0.1) {
          ctx.ragged = true; changed = true;
          // ragged margins: the right margin is the longest typical line, the band starts
          // around the 15th percentile of lines that clearly continue mid-sentence
          for (const sec of secs) {
            if (!sec.wrapped) continue;
            const lens = sec.lines.filter(l => l.dec).map(l => l.len);
            const cont = sec.lines.filter(l => l.dec && l.dec.st === 'lower' && l.dec.et !== 'terminal').map(l => l.len);
            if (lens.length < 5) continue;
            sec.W = percentileDesc(lens, 0.01);
            sec.rmin = cont.length >= 5 ? percentileDesc(cont, 0.95) : Math.round(sec.W * 0.7);
          }
          stats.passes.push('ragged (manually wrapped) margins detected');
        }
      }
      if (ctx.ragged) { if (iter === 0) continue; break; }
      for (const sec of secs) {
        if (!sec.wrapped) continue;
        const soft = sec.lines.filter(l => l.dec && l.dec.fitSoft).map(l => l.len);
        if (soft.length < 10) continue;
        const nw = Math.max(sec.W - 12, Math.min(sec.W + ctx.slop, percentileDesc(soft, 0.01)));
        if (nw !== sec.W) { sec.W = nw; changed = true; }
      }
      if (!changed) break;
    }
    stats.iterations = iter + 1;
    stats.passes.push(`join decisions converged after ${stats.iterations} pass(es)`);
    stats.ragged = ctx.ragged;
    stats.sectionWidths = [...new Set(secs.filter(s => s.lines.length && s.wrapped).map(s => s.W))];

    // Pass n+1: structural post-classification of prose + node building
    const nodes = [];
    const src = lines => [lines[0].i, lines[lines.length - 1].i];
    const tidy = t => t.replace(/\s{2,}/g, ' ').trim();
    const termFrac = L => L.filter(l => endType(l.text) === 'terminal').length / L.length;
    const recordDecs = (L, kind) => L.forEach((l, j) => {
      const d = j < L.length - 1 ? l.dec : null;
      Object.assign(info[l.i], { kind, W: secs[l.sec] ? secs[l.sec].W : null });
      if (d) Object.assign(info[l.i], { join: d.join ? 'soft' : d.type, score: d.score, reasons: d.reasons });
    });
    const buildParas = L => {
      const paras = [];
      let cur = null;
      L.forEach((l, j) => {
        const d = j > 0 ? L[j - 1].dec : null;
        if (!cur) cur = { parts: [l.text], src: [l.i, l.i] };
        else if (d.join) cur.parts[cur.parts.length - 1] = joinText(cur.parts[cur.parts.length - 1], L[j - 1], l, ctx);
        else if (d.type === 'br') cur.parts.push(l.text);
        else { paras.push(cur); cur = { parts: [l.text], src: [l.i, l.i] }; }
        cur.src[1] = l.i;
      });
      if (cur) paras.push(cur);
      paras.forEach(p => { p.parts = p.parts.map(tidy); });
      return paras;
    };
    const verseNode = L => {
      const min = Math.min(...L.map(l => l.indent));
      recordDecs(L, 'verse');
      return { type: 'verse', lines: L.map(l => ({ text: l.text, indent: l.indent - min })), src: src(L) };
    };

    // Titles and headings also keep their own lines, and whether the source centred them, so they
    // can be shown as ordinary text when heading detection is turned off (toHTML's `headings`).
    const asText = L => { const T = L.filter(l => !isRuleLike(l.text)); return { lines: T.map(l => tidy(l.text)), centered: T.every(l => isCentered(l, ctx.W, ctx.paraIndent)) }; };
    for (const it of items) {
      const L = it.lines;
      switch (it.type) {
        case 'title': case 'byline': case 'meta': case 'center':
          mark(L, it.type);
          nodes.push({ type: it.type, lines: L.map(l => tidy(l.text)), src: src(L), ...(it.type === 'title' ? { plain: asText(L) } : {}) });
          break;
        case 'verse':
          nodes.push(verseNode(L));
          break;
        case 'break':
          mark(L, 'break');
          nodes.push({ type: 'break', src: src(L) });
          break;
        case 'note':
          mark(L, 'note');
          nodes.push({ type: 'note', text: tidy(L.map(l => l.text).join(' ')), src: src(L) });
          break;
        case 'pre':
          mark(L, 'pre');
          { const min = Math.min(...L.map(l => l.indent)); nodes.push({ type: 'pre', text: L.map(l => ' '.repeat(l.indent - min) + l.text).join('\n'), src: src(L) }); }
          break;
        case 'heading':
          mark(L, 'heading'); mark(it.subLines, 'subtitle');
          nodes.push({ type: 'heading', level: it.level, label: tidy(it.label), sub: tidy(it.sub || ''), src: src([...L, ...it.subLines]), plain: asText([...L, ...it.subLines]) });
          break;
        case 'prose': {
          const sec = secs[it.sec], Ws = sec.W, n = L.length;
          if (it.whole && sec.wrapped && n <= 6 && L.every(l => isCentered(l, Ws, ctx.paraIndent))) {
            recordDecs(L, 'center');
            nodes.push({ type: 'center', lines: L.map(l => tidy(l.text)), src: src(L) });
            break;
          }
          if (it.whole && n >= 2) {
            const hard = L.slice(0, -1).filter(l => !l.dec.join).length;
            if (hard / (n - 1) >= 0.6 && termFrac(L) < 0.6 && (!sec.wrapped || Math.max(...L.map(l => l.len)) <= 0.85 * Ws)) {
              nodes.push(verseNode(L));
              break;
            }
            if (sec.wrapped && L.every(l => l.indent >= ctx.bodyIndent + 2) && L.some(l => l.dec && l.dec.join) && !L.every(l => isCentered(l, Ws, ctx.paraIndent))) {
              recordDecs(L, 'quote');
              nodes.push({ type: 'quote', paras: buildParas(L), src: src(L) });
              break;
            }
          }
          // find verse runs inside larger prose blocks
          const short = l => sec.wrapped ? l.len <= 0.85 * Ws : l.len <= 80;
          let pr = [];
          const flushProse = () => {
            if (!pr.length) return;
            recordDecs(pr, 'prose');
            buildParas(pr).forEach(p => nodes.push({ type: 'p', parts: p.parts, src: p.src }));
            pr = [];
          };
          let j = 0;
          while (j < n) {
            let e = j;
            if (j === 0 || !L[j - 1].dec.join) while (e < n && short(L[e]) && (e === n - 1 || !L[e].dec.join)) e++;
            const run = L.slice(j, e);
            if (run.length >= 3 && termFrac(run) < 0.5) { flushProse(); nodes.push(verseNode(run)); j = e; }
            else if (run.length >= 3) { pr.push(...run); j = e; }
            else { pr.push(L[j]); j++; }
          }
          flushProse();
          break;
        }
      }
    }

    // Final pass: rejoin paragraphs interrupted by illustrations, page furniture or stray
    // blank lines (a paragraph that starts lowercase after one that did not end a sentence).
    let rejoined = 0;
    for (let q = 0; q < nodes.length; q++) {
      const cur = nodes[q];
      if (cur.type !== 'p' || startType(cur.parts[0]) !== 'lower') continue;
      let p = q - 1;
      while (p >= 0 && q - p <= 4 && ['note', 'pre', 'center'].includes(nodes[p].type)) p--;
      const prev = nodes[p];
      if (!prev || prev.type !== 'p' || endType(prev.parts[prev.parts.length - 1]) === 'terminal') continue;
      const last = prev.parts.length - 1;
