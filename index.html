  let widthOverride = null;
  let page = 0, pages = 1, stride = 1;

  const isPaged = () => !!doc && view === 'reflow' && S.layout !== 'scroll';
  // The layout actually in use: Raw always scrolls (with Scroll's width), whatever is saved for Reflowed.
  // Phones (same breakpoint as the compact CSS) have no room for Spread: the saved choice shows as Page.
  const compactMQ = matchMedia('(max-width: 700px)');
  const layoutNow = () => (doc && view === 'raw' ? 'scroll' : compactMQ.matches && S.layout === 'spread' ? 'page' : S.layout);
  // Phones, held either way (a landscape phone is wider than the compact breakpoint but short):
  // the toolbar and scrub bar float over the text and hide while reading (see "auto-hiding bars").
  const autoMQ = matchMedia('(max-width: 700px), (pointer: coarse) and (max-height: 500px)');

  /* ---------------- settings ---------------- */
  function applySettings() {
    const root = document.documentElement;
    root.dataset.theme = S.theme;
    $('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue('--ui').trim(); // browser bars match the theme
    root.style.setProperty('--font', fontOf(S.font).stack);
    root.style.setProperty('--fs', S.fs + 'px');
    root.style.setProperty('--lh', S.lh);
    content.classList.toggle('justify', S.align === 'justify');
    content.classList.toggle('indent', S.para === 'indent');
    document.body.classList.toggle('chapter-breaks', !!S.chapterBreaks);
    document.body.classList.toggle('has-doc', !!doc);
    $('#setTheme').value = S.theme; if (fontMenu) $('#setFont').value = (fontMenu.find(f => f.label === fontOf(S.font).label) || {}).id || ''; $('#setSize').value = S.fs; $('#setLh').value = S.lh;
    $('#setAlign').value = S.align; $('#setPara').value = S.para; $('#setSmart').checked = S.smart; $('#setChapter').checked = S.chapterBreaks;
    $('#setHeadings').checked = S.headings; $('#setChapter').disabled = !S.headings; // no headings, no chapter breaks
    // Raw always scrolls: show that, and lock the layout buttons (the saved layout is kept for Reflowed)
    const rawLock = !!doc && view === 'raw';
    document.querySelectorAll('#layoutSeg button').forEach(b => {
      const on = b.dataset.layout === layoutNow();
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      b.disabled = !doc; b.setAttribute('aria-disabled', rawLock); b.setAttribute('aria-label', b.dataset.label);
      b.dataset.tip = rawLock ? 'Raw view always scrolls' : b.dataset.label;
    });
    document.querySelectorAll('#viewSeg button').forEach(b => { b.classList.toggle('on', b.dataset.view === view); b.disabled = !doc; });
    // Controls that act on the open file are disabled on the Home screen (Settings and Open stay usable).
    ['#btnHome', '#btnDebug', '#btnExport'].forEach(sel => { $(sel).disabled = !doc; });
    $('#btnDebug').classList.toggle('on', debug);
    document.body.classList.toggle('debug', debug);
  }

  const bindSetting = (id, key, parse, rerender) => $(id).addEventListener('input', e => {
    const a = holdAnchor();
    S[key] = parse(e.target);
    save(); applySettings();
    if (rerender) render(a); else relayout(a);
  });
  bindSetting('#setTheme', 'theme', t => t.value);
  bindSetting('#setFont', 'font', t => t.value);
  bindSetting('#setSize', 'fs', t => +t.value);
  bindSetting('#setLh', 'lh', t => +t.value);
  bindSetting('#setAlign', 'align', t => t.value);
  bindSetting('#setPara', 'para', t => t.value);
  bindSetting('#setSmart', 'smart', t => t.checked, true);
  bindSetting('#setHeadings', 'headings', t => t.checked, true);
  bindSetting('#setChapter', 'chapterBreaks', t => t.checked);

  /* ---------------- loading ---------------- */
  function decode(buf) {
    const b = new Uint8Array(buf);
    if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
    if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch { return new TextDecoder('windows-1252').decode(buf); }
  }

  async function openFile(file) {
    openSource(decode(await file.arrayBuffer()), file.name);
  }

  // `src` is the file as decoded (RTF still raw): Recent keeps it, and its hash keys the saved position.
  function openSource(src, name, fromHistory = false) {
    const key = hashText(src);
    if (/\.rtf$/i.test(name) || /^\s*\{\\rtf/.test(src.slice(0, 32))) {
      const r = Reflow.fromRTF(src);
      loadText(r.text, name, { key, hints: r.hints, metaTitle: r.title, source: 'RTF', fromHistory });
    } else loadText(src, name, { key, fromHistory });
    Recent.add({ key, name, src, title: doc.metaTitle || doc.res.stats.title || '' });
  }

  function loadText(text, name, extra = {}) {
    savePosNow();
    resetSearch();
    doc = { name, text, ...extra };
    if (!doc.key) doc.key = hashText(text);
    analyze();
    render(null);
    const a = savedAnchor();
    if (a) { relayout(a); held = a; }
    syncAutoHide(); setChrome(false); // a newly opened book starts with the bars showing
    if (!extra.fromHistory) history.pushState({ book: doc.key }, ''); // so Back returns Home (see "history")
    stage.focus();
  }

  /* ---------------- history ---------------- */
  // Each opened book gets a history entry (no URL change), so the browser's Back, including Safari's
  // edge swipe, returns to Home instead of leaving the site, and Forward reopens the book from Recent.
  // Home in the app goes Back too, keeping the two in step.
  function leaveBook() {
    if (!doc) return;
    if (history.state && history.state.book) history.back(); else goHome();
  }
  window.addEventListener('popstate', async e => {
    const key = e.state && e.state.book;
    if (!key) { if (doc) goHome(); return; }
    if (doc && doc.key === key) return;
    let r = null;
    try { r = await Recent.get(key); } catch { /* no IndexedDB */ }
    if (r) openSource(r.src, r.name, true);
    else { history.replaceState(null, ''); if (doc) goHome(); } // not kept (too big, private window): Home
  });
  // A reload keeps history.state, but nothing reopens automatically: start from Home.
  if (history.state && history.state.book) history.replaceState(null, '');

  function hashText(t) { // FNV-1a plus length, so collisions are vanishingly rare
    let h = 0x811c9dc5;
    for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(36) + '-' + t.length.toString(36);
  }

  /* ---------------- reading positions (per file, localStorage) ---------------- */
  // Stored as the anchor element's first source line + character offset into it, so it survives any
  // font/size/layout change. { [key]: { line, off, view, pct, name, t } }, newest 200 kept.
  const POS_KEY = 'reflower.positions';
  const loadPositions = () => { try { return JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch { return {}; } };
  let posTimer = 0;
  function queueSavePos() { clearTimeout(posTimer); posTimer = setTimeout(savePosNow, 400); }
  function savePosNow() {
    clearTimeout(posTimer);
    if (!doc || !doc.key) return;
    const a = currentAnchor();
    if (!a || !a.el) return;
    let off = 0;
    if (a.caret && a.el.contains(a.caret.node)) {
      const r = document.createRange();
      r.setStart(a.el, 0); r.setEnd(a.caret.node, a.caret.offset);
      off = r.toString().length;
    }
    const pr = progress(), pct = pr ? pr.pct : 0;
    const all = loadPositions();
    all[doc.key] = { src: a.src, line: a.line, off, view, pct: Math.round(pct * 1000) / 1000, name: doc.name, t: Date.now() };
    Object.keys(all).sort((x, y) => all[y].t - all[x].t).slice(200).forEach(k => delete all[k]);
    try { localStorage.setItem(POS_KEY, JSON.stringify(all)); } catch { /* quota: skip */ }
  }
  function savedAnchor() {
    const p = loadPositions()[doc.key];
    if (!p) return null;
    if (p.src != null) return anchorAtSrc(p.src);
    const el = blockAtLine(p.line); // positions saved before `src` existed
    if (!el) return null;
    let caret = null;
    const startLine = el.dataset.l != null ? +el.dataset.l : +el.dataset.s;
    if (p.view === view && startLine === p.line && p.off > 0) { // walk to the character offset
      const it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let n, left = p.off;
      while ((n = it.nextNode())) { if (left < n.length) { caret = { node: n, offset: left }; break; } left -= n.length; }
    }
    return { caret, line: startLine, el, src: srcOf(el, caret) };
  }
  window.addEventListener('pagehide', savePosNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePosNow(); });

  /* ---------------- recent files (IndexedDB copy of the source text) ---------------- */
  // Nothing reopens automatically: the start screen lists recent files and the reader picks one.
  const Recent = (() => {
    const MAX = 8, MAX_CHARS = 30e6;
    let dbp = null;
    const db = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('reflower', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'key' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const d = await db();
      return new Promise((res, rej) => {
        const t = d.transaction('files', mode), req = fn(t.objectStore('files'));
        t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
      });
    };
    const list = async () => ((await tx('readonly', s => s.getAll())) || []).sort((a, b) => b.t - a.t);
    return {
      list,
      get: key => tx('readonly', s => s.get(key)),
      async add(rec) {
        try {
          if (rec.src.length > MAX_CHARS) return;
          await tx('readwrite', s => s.put({ ...rec, t: Date.now() }));
          const old = (await list()).slice(MAX);
          if (old.length) await tx('readwrite', s => old.forEach(r => s.delete(r.key)));
        } catch { /* storage unavailable (e.g. private window): Recent just stays empty */ }
      },
      forget: key => tx('readwrite', s => s.delete(key)),
      clear: () => tx('readwrite', s => s.clear()),
    };
  })();

  async function showRecent() {
    const box = $('#recent');
    if (!box) return;
    let items = [];
    try { items = await Recent.list(); } catch { /* no IndexedDB */ }
    if (!items.length) { box.innerHTML = ''; return; }
    const pos = loadPositions();
    const ago = t => { const m = (Date.now() - t) / 6e4; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
    // The file name is what the reader knows the file by, so it always leads, in full; a detected
    // title (which can be a guess, or stale RTF metadata) is only shown under it, and only if different.
    const key = t => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
    const same = (name, t) => key(name.replace(/\.[a-z0-9]{1,4}$/i, '')) === key(t);
    box.innerHTML = '<h4>Continue reading</h4>' + items.map(r => {
      const p = pos[r.key], title = Reflow.stripMarkers(r.title).replace(/\s+/g, ' ').trim(), sub = title && !same(r.name, title) ? `<span class="title">${escHTML(title)}</span>` : '';
      return `<div class="item"><button class="open" data-key="${escHTML(r.key)}" title="Reopen ${escHTML(r.name)}"><span class="label"><span class="name">${escHTML(r.name)}</span>${sub}</span>`
        + `<span class="when">${p ? Math.floor(p.pct * 100) + '% · ' : ''}${ago(p ? Math.max(p.t, r.t) : r.t)}</span></button>`
        + `<button class="forget" data-key="${escHTML(r.key)}" title="Forget this file">✕</button></div>`;
    }).join('') + '<button class="forgetAll">Forget all recent files</button>';
  }
  content.addEventListener('click', async e => {
    if (doc) return;
    if (e.target.closest('#dropBox')) { $('#fileInput').click(); return; }
    const b = e.target.closest('#recent button');
    if (!b) return;
    e.stopPropagation();
    if (b.classList.contains('open')) {
      const r = await Recent.get(b.dataset.key);
      if (r) openSource(r.src, r.name); else showRecent();
    } else {
      if (b.classList.contains('forgetAll')) await Recent.clear(); else await Recent.forget(b.dataset.key);
      showRecent();
    }
  });

  function analyze() {
    const t0 = performance.now();
    doc.res = Reflow.analyze(doc.text, { width: widthOverride, hints: doc.hints });
    doc.ms = Math.round(performance.now() - t0);
    // Progress is measured in source characters, so it is the same in every layout and view.
    // The readable range leaves out folded boilerplate, so the story's last page reads 100%.
    const lines = doc.res.lines, off = doc.srcOff = new Float64Array(lines.length + 1);
    lines.forEach((l, i) => { off[i + 1] = off[i] + l.raw.length + 1; });
    const body = doc.res.nodes.filter(nd => !nd.boiler);
    doc.range = body.length ? [off[body[0].src[0]], off[body[body.length - 1].src[1] + 1]] : [0, off[lines.length]];
    // Chapters (headings outside folded boilerplate), for the search results and the scrub bar
    // (only while heading detection is on: see render).
    doc.detected = body.filter(nd => nd.type === 'heading').map(nd => ({ line: nd.src[0], label: Reflow.stripMarkers(nd.label) }));
  }
  function chapterAtLine(line) {
    const C = doc.chapters, k = lastAtOrBefore(C.length, j => C[j].line, line);
    return k < 0 ? '' : C[k].label;
  }

  /* ---------------- rendering ---------------- */
  function render(anchor) {
    if (!doc) return;
    doc.chapters = S.headings ? doc.detected : [];
    if (view === 'raw') {
      const { lines, info } = doc.res;
      content.className = 'raw';
      content.innerHTML = lines.map((l, i) => {
        const x = info[i];
        const glyph = x.join === 'soft' ? `↩ ${x.score}` : x.join === 'para' ? `¶ ${x.score}` : x.join === 'br' ? `↵ ${x.score}` : '';
        const tip = x.reasons ? ` title="${escHTML(x.kind + ' | ' + x.join + ' (' + x.score + ') W=' + x.W + '\n' + x.reasons.join('\n'))}"` : ` title="${x.kind}"`;
        return `<div class="rl j-${x.join || 'none'}" data-l="${i}" data-kind="${x.kind}"${tip}><span class="ln">${i + 1}</span><span class="rt">${escHTML(l.raw) || ' '}</span><span class="rd">${glyph}</span></div>`;
      }).join('') + '<div id="endSentinel"></div>';
    } else {
      const { html, toc } = Reflow.toHTML(doc.res.nodes, { smart: S.smart, headings: S.headings });
      content.className = '';
      content.innerHTML = html + '<div id="endSentinel"></div>';
      doc.toc = toc;
    }
    applySettings();
    $('#docname').textContent = doc.name;
    document.title = (doc.metaTitle || doc.res.stats.title || doc.name) + ' — Reflower';
    renderToc();
    renderDebug();
    doc.blocks = [...content.children].filter(c => c.dataset.s != null || c.dataset.l != null);
    if (anchor && anchor.src != null) anchor = anchorAtSrc(anchor.src);
    held = anchor; // so toggling back and forth (Raw, smart typography) lands on the same spot every time
    relayout(anchor);
    if (!anchor) { stage.scrollTop = 0; setPage(0, false); }
    if (SR.q) runSearch(); // new DOM: the old match ranges point at detached nodes
  }

  const HOME_HTML = content.innerHTML, HOME_TITLE = document.title;
  function goHome() {
    if (!doc) return;
    savePosNow();
    resetSearch();
    clearTimeout(progTimer); progTimer = 0;
    doc = null; held = null; page = 0; pages = 1;
    content.className = '';
    content.innerHTML = HOME_HTML;
    $('#docname').textContent = '';
    document.title = HOME_TITLE;
    $('#tocList').innerHTML = '<div class="empty">No document loaded</div>';
    toggleToc(false);
    setChrome(false); // Home always shows the bars (Open lives there)
    renderDebug(); applySettings(); relayout(null);
    stage.scrollTop = 0;
    updateIndicator();
    showRecent();
  }

  function renderToc() {
    const list = $('#tocList');
    if (!doc || !doc.toc || !doc.toc.length) { list.innerHTML = `<div class="empty">${S.headings ? 'No headings detected' : 'Heading detection is off (Settings)'}</div>`; return; }
    const minL = Math.min(...doc.toc.filter(t => t.level > 0).map(t => t.level), 2);
    list.innerHTML = doc.toc.map(t => {
      const lvl = t.level === 0 ? 0 : t.level - minL + 1;
      return `<a href="#${t.id}" class="l${lvl}" data-id="${t.id}">${escHTML(t.text)}${t.sub ? ` <small>${escHTML(t.sub)}</small>` : ''}</a>`;
    }).join('');
  }

  function renderDebug() {
    const box = $('#debugBox');
    if (!doc) { box.innerHTML = ''; return; }
    const st = doc.res.stats;
    const yes = v => v ? 'yes' : 'no';
    const rows = [
      ...(doc.source ? [['source', `${doc.source} (converted to text; Raw shows the conversion)`]] : []),
      ['wrap width', st.width ?? '—'], ['hard-wrapped', `${yes(st.wrapped)} (${st.confidence}%)`],
      ['section widths', st.sectionWidths.join(', ') || '—'], ['double-spaced', yes(st.doubleSpaced)],
      ['flowed', yes(st.flowed)], ['ragged', yes(st.ragged)], ['blank-separated', yes(st.blankSeparated)],
      ['lines', `${st.lines} (${st.joined} joined, ${st.kept} kept)`],
      ['nodes', Object.entries(st.counts).map(([k, v]) => `${k}:${v}`).join(' ')],
      ['passes', st.passes.join('<br>')], ['time', doc.ms + ' ms'],
    ];
    box.innerHTML = `<table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
      <div style="margin-top:6px">Force width: <input id="dbgWidth" type="number" min="20" max="400" placeholder="auto" value="${widthOverride || ''}">
      <span style="color:var(--muted)"> (blank = auto)</span></div>`;
    $('#dbgWidth').addEventListener('change', e => {
      const v = parseInt(e.target.value, 10);
      widthOverride = v >= 20 ? v : null;
      const a = holdAnchor();
      analyze(); render(a);
    });
  }

  /* ---------------- layout / paging ---------------- */
  const GAP = 64;

  function relayout(anchor) {
    stopTurn();
    const paged = isPaged();
    document.documentElement.style.setProperty('--tb-h', $('#toolbar').offsetHeight + 'px'); // drawers sit below it, even when it wraps
    document.body.classList.toggle('paged', paged);
    document.body.classList.toggle('spread', paged && layoutNow() === 'spread');
    const w = Math.min(S.widths[layoutNow()] || 760, window.innerWidth - 24);
    document.documentElement.style.setProperty('--pane-w', Math.max(320, w) + 'px');
    // With the search panel docked, the stage ends at the panel, but
    // the page keeps the place it had without the panel, moving left only as far as it must to clear it.
    pane.style.marginLeft = '';
    const docked = document.body.classList.contains('search-open') && parseFloat(getComputedStyle(stage).marginRight) > 28;
    if (docked) {
      const P = Math.max(320, w), Wd = stage.clientWidth, Wu = Wd + $('#search').offsetWidth; // ...and without it
      if (P <= Wd - 24) pane.style.marginLeft = Math.min((Wu - P) / 2, Wd - 12 - P) + 'px';
    }
    content.style.width = content.style.height = content.style.columnCount = content.style.columnGap = content.style.columnFill = content.style.transform = '';
    if (paged) {
      const vw = Math.floor(viewport.clientWidth), vh = Math.floor(viewport.clientHeight);
      Object.assign(content.style, { width: vw + 'px', height: vh + 'px', columnCount: layoutNow() === 'spread' ? 2 : 1, columnGap: GAP + 'px', columnFill: 'auto' });
      stride = vw + GAP;
      const sent = $('#endSentinel');
      pages = sent ? Math.max(1, Math.floor((sent.getBoundingClientRect().left - content.getBoundingClientRect().left) / stride) + 1) : 1;
      if (anchor) page = pageOfAnchor(anchor);
      restoring = true; setPage(page, false); restoring = false;
    } else if (anchor) {
      revealRect(anchorRect(anchor));
    }
    ownScrollTop = stage.scrollTop;
    measureChapters(); updateScrub();
    updateIndicator();
  }

  // Page turns fade with a short drift in the direction of travel, rather than sliding the whole
  // column strip past (which, in Spread, also runs under the fixed spine and reads as a ribbon).
  // Turns and swipe glides are stepped by hand (style per frame), not with element.animate(): an
  // animated transform makes Chrome paint the whole column strip, i.e. the whole book, every frame
  // (~400 ms a frame on a 350 KB file), where a plain style change repaints just the visible page.
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let turn = null; // the running motion: { raf, step } (step(1) is its final state)
  function tween(ms, step) {
    stopTurn();
    const t0 = performance.now(), tick = now => {
      const k = Math.min(1, (now - t0) / ms);
      if (k < 1) turn.raf = requestAnimationFrame(tick); else turn = null;
      step(k);
    };
    turn = { raf: requestAnimationFrame(tick), step };
  }
  function stopTurn() { // jump a running motion to its end (so rects measured next are final)
    if (!turn) return;
    const t = turn; turn = null;
    cancelAnimationFrame(t.raf); t.step(1);
  }
  function setPage(p, animate = true) {
    if (!isPaged()) return;
    if (!restoring) held = null;
    const from = page;
    page = Math.max(0, Math.min(pages - 1, p));
    stopTurn();
    content.style.transform = `translateX(${-page * stride}px)`;
    if (animate && page !== from && !reduceMotion.matches) {
      // fade out drifting in the direction of travel (ease-in), then the new page fades in (ease-out)
      const dir = Math.sign(page - from), to = page, x = (n, d) => `translateX(${-n * stride + d}px)`;
      tween(240, k => {
        const out = k < 0.4, u = out ? k / 0.4 : (k - 0.4) / 0.6, e = out ? u * u : 1 - (1 - u) * (1 - u);
        content.style.transform = out ? x(from, -dir * 18 * e) : x(to, dir * 18 * (1 - e));
        content.style.opacity = k < 1 ? (out ? 1 - e : e) : '';
      });
    }
    if (page !== from && !restoring) setChrome(true); // reading on: phones tuck the bars away
    updateScrub();
    updateIndicator();
  }

  /* ---------------- scrub bar ---------------- */
  // A slider over the whole book along the bottom, with a tick where each chapter starts. Its position
  // is the page in Page / Spread and the scroll offset in Scroll (so it moves smoothly there, and
  // stands in for the hidden scrollbar). Hover or drag shows the progress readout plus the chapter;
  // dragging moves the text live (no page-turn animation).
  const SCROLL_STEPS = 1000; // range resolution in Scroll (pages are the steps in Page / Spread)
  let marks = []; // doc.chapters placed on the bar: [{ pos, label }], measured on each relayout
  const scrubRange = $('#scrubRange'), scrubTip = $('#scrubTip');
  const posMax = () => (isPaged() ? Math.max(0, pages - 1) : Math.max(0, stage.scrollHeight - stage.clientHeight));
  const posNow = () => (isPaged() ? page : stage.scrollTop);
  const posFrac = x => { const m = posMax(); return m ? Math.max(0, Math.min(1, x / m)) : 0; };
  const anchorAtPos = x => (isPaged() ? anchorAtPage(x) : anchorAtScroll(x));
  function measureChapters() {
    marks = [];
    if (doc && doc.blocks) {
      const paged = isPaged(), max = posMax();
      const top = stage.getBoundingClientRect().top - stage.scrollTop + READ_Y; // the reading line at scrollTop 0
      for (const c of doc.chapters) {
        const el = blockAtLine(c.line), r = el && el.getClientRects()[0];
        if (r) marks.push({ pos: Math.min(max, paged ? pageOfRect(r) : Math.max(0, r.top - top)), label: c.label }); // its page / the scrollTop bringing it to the reading line
      }
    }

    if (!doc) return;
    toggleToc(false);
    setChrome(false);
    if (!searchOpen()) {
      $('#search').classList.add('open');
      $('#search .sbody').inert = false; $('#searchTab').setAttribute('aria-expanded', 'true');
      document.body.classList.add('search-open');
      if (HL) { CSS.highlights.set('search', HL.all); CSS.highlights.set('search-cur', HL.cur); }
      relayout(holdAnchor()); // docked: now, not next frame, so the page never visibly jumps
    }
    const inp = $('#searchInput');
    inp.focus(); inp.select();
  }
  function closeSearch(keepPlace = true) {
    if (!searchOpen()) return;
    $('#search').classList.remove('open');
    $('#search .sbody').inert = true; $('#searchTab').setAttribute('aria-expanded', 'false');
    document.body.classList.remove('search-open');
    if (HL) { CSS.highlights.delete('search'); CSS.highlights.delete('search-cur'); }
    if (keepPlace) { relayout(holdAnchor()); stage.focus(); }
  }
  function resetSearch() { // new document or Home: start over (the caller lays the page out afresh)
    closeSearch(false);
    clearTimeout(searchTimer);
    SR.q = ''; SR.origin = null; SR.pending = 0;
    $('#searchInput').value = '';
    runSearch();
  }

  let searchTimer = 0;
  const flushSearch = () => {
    clearTimeout(searchTimer); searchTimer = 0;
    const q = $('#searchInput').value;
    if (q !== SR.q) { SR.q = q; runSearch(); }
  };
  $('#searchInput').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(flushSearch, 200); });
  $('#searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); flushSearch(); searchGo(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });
  $('#searchTab').addEventListener('click', () => (searchOpen() ? closeSearch() : openSearch()));
  $('#searchClose').addEventListener('click', closeSearch);
  $('#searchNext').addEventListener('click', () => { flushSearch(); searchGo(1); });
  $('#searchPrev').addEventListener('click', () => { flushSearch(); searchGo(-1); });
  // Phones: a tap shows the match below the sheet; a second tap on the same row within half a second
  // closes the sheet, keeping the match on screen (detected here: iOS doesn't reliably fire dblclick).
  let lastTap = { k: -1, t: 0 };
  $('#searchList').addEventListener('click', e => {
    const b = e.target.closest('.hit');
    if (!b) return;
    const k = +b.dataset.k, now = Date.now();
    if (compactMQ.matches) {
      if (k === lastTap.k && now - lastTap.t < 500) { lastTap = { k: -1, t: 0 }; closeSearch(); return; }
      lastTap = { k, t: now };
      if (document.activeElement === $('#searchInput')) $('#searchInput').blur(); // drop the keyboard so the page shows
    }
    selectHit(k);
  });
  $('#searchBack').addEventListener('click', () => {
    if (SR.origin == null || !doc) return;
    const a = anchorAtSrc(SR.origin);
    SR.origin = null; SR.cur = -1; // the next step goes from here again
    if (HL) HL.cur.clear();
    const old = $('#searchList .hit.cur');
    if (old) old.classList.remove('cur');
    if (a) relayout(a);
    held = null; updateIndicator();
    searchStatus();
  });

  /* ---------------- export ---------------- */
  const baseName = () => (doc ? doc.name.replace(/\.[^.]+$/, '') : 'document');
  function download(name, type, data) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const exportCSS = () => `body{background:#f4f1ea;margin:0;color:#2b2a27}article{max-width:38em;margin:2em auto;padding:3em 3.5em;background:#fffdf8;font:${S.fs}px/${S.lh} ${fontOf(S.font).stack};box-shadow:0 2px 18px rgba(0,0,0,.08)}
p{margin:0 0 .85em}.doc-title{text-align:center;margin-bottom:1.6em}.doc-title h1{font-weight:normal;font-size:2em;margin:0 0 .25em}.subtitle{font-style:italic;margin:0}
.byline{text-align:center;font-style:italic;margin-bottom:1.4em}.meta{font-size:.85em;color:#8a857b;border-left:3px solid #ddd;padding-left:.8em;margin-bottom:1.2em}
h2{text-align:center;font-weight:normal;font-size:1.4em;margin:2.2em 0 1.2em}h2 .sub{display:block;font-size:.72em;font-style:italic;margin-top:.35em}
.scene-break{text-align:center;letter-spacing:.9em;color:#999;margin:1.1em 0}.verse{margin:.8em 0 1.1em 1.6em}.vl{text-indent:-1.2em;padding-left:1.2em}
.center{text-align:center;margin:.8em 0 1.1em}blockquote{margin:.8em 1.6em 1.1em}pre{font-size:.72em;overflow-x:auto}`;
  $('#expTxt').addEventListener('click', () => { if (doc) download(baseName() + '.reflowed.txt', 'text/plain;charset=utf-8', Reflow.toText(doc.res.nodes, { smart: S.smart })); });
  $('#expHtml').addEventListener('click', () => {
    if (!doc) return;
    const { html } = Reflow.toHTML(doc.res.nodes, { smart: S.smart, headings: S.headings });
    const title = (doc.res.stats.title || baseName()).replace(/</g, '&lt;');
    download(baseName() + '.html', 'text/html;charset=utf-8',
      `<!DOCTYPE html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${title}</title><style>${exportCSS()}</style></head>\n<body><article>\n${html}\n</article></body></html>\n`);
  });

  /* ---------------- input: keys, wheel, clicks ---------------- */
  document.addEventListener('keydown', e => {
    if (e.key === 'F3' && searchOpen() && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); searchGo(e.shiftKey ? -1 : 1); return; }
    if (e.target.closest('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape') { Object.values(panels).forEach(s => $(s).classList.remove('open')); toggleToc(false); closeSearch(); return; }
    if (k === 'o' || k === 'O') { $('#fileInput').click(); return; }
    if (k === 'h' || k === 'H') { leaveBook(); return; }
    if (!doc) return;
    if (k === 't' || k === 'T') { toggleToc(); return; }
    if (k === '/') { e.preventDefault(); openSearch(); return; }
    if (k === 'd' || k === 'D') { $('#btnDebug').click(); return; }
    if (k === 'r' || k === 'R') { setView(view === 'raw' ? 'reflow' : 'raw'); return; }
    if (k === '1' || k === '2' || k === '3') { setLayout(['scroll', 'page', 'spread'][+k - 1]); return; }
    if (isPaged()) {
      const next = ['ArrowRight', 'ArrowDown', 'PageDown'].includes(k) || (k === ' ' && !e.shiftKey);
      const prev = ['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k) || (k === ' ' && e.shiftKey);
      if (next) setPage(page + 1); else if (prev) setPage(page - 1);
      else if (k === 'Home') setPage(0); else if (k === 'End') setPage(pages - 1); else return;
      e.preventDefault();
    } else {
      const h = stage.clientHeight * 0.9;
      const d = { ArrowDown: 48, ArrowUp: -48, PageDown: h, PageUp: -h, ' ': e.shiftKey ? -h : h }[k];
      if (d != null) stage.scrollBy({ top: d, behavior: k.startsWith('Arrow') ? 'auto' : 'smooth' });
      else if (k === 'Home') stage.scrollTop = 0; else if (k === 'End') stage.scrollTop = stage.scrollHeight; else return;
      e.preventDefault();
    }
  });

  let wheelAcc = 0, lastFlip = 0;
  stage.addEventListener('wheel', e => {
    if (!isPaged()) return;
    e.preventDefault();
    wheelAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    const now = Date.now();
    if (Math.abs(wheelAcc) >= 40 && now - lastFlip > 250) { setPage(page + Math.sign(wheelAcc)); lastFlip = now; wheelAcc = 0; }
    else if (now - lastFlip > 600) wheelAcc = Math.max(-40, Math.min(40, wheelAcc));
  }, { passive: false });

  // Tap zones: the outer quarters of the text, extended out through the page margins and the
  // background on either side, so clicking anywhere left or right of the text turns the page.
  // The middle (or, in Scroll, anywhere) shows / hides the bars on phones.
  stage.addEventListener('click', e => {
    if (String(window.getSelection()) || tapClosedSomething || Date.now() - swipedAt < 350) return; // a swipe's lift isn't a tap
    if (e.target.closest('button, a, summary, input, select, .handle, #pager')) return;
    if (isPaged()) {
      const r = viewport.getBoundingClientRect(), zone = r.width * 0.25;
      if (e.clientX < r.left + zone) { setPage(page - 1); return; }
      if (e.clientX > r.right - zone) { setPage(page + 1); return; }
    }
    if (autoHiding()) setChrome(!chromeHidden);
  });
  $('#pgPrev').addEventListener('click', () => setPage(page - 1));
  $('#pgNext').addEventListener('click', () => setPage(page + 1));

  /* ---------------- swipe to turn pages (touch, Page / Spread) ---------------- */
  // The column strip follows the finger (the neighbouring page slides in beside it); let go past a
  // fifth of the width, or with a flick, to turn, otherwise it springs back. Touches starting within
  // SWIPE_EDGE px of the screen's sides are left alone: Safari's back/forward and Android's back
  // gestures live there and can't be overridden. Vertical moves, pinches and text selection don't swipe.
  const SWIPE_EDGE = 24;
  let swipe = null, swipedAt = 0;
  const stripX = n => -n * stride;
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || !e.isPrimary || !isPaged()) return;
    if (e.clientX < SWIPE_EDGE || e.clientX > window.innerWidth - SWIPE_EDGE) return;
    if (e.target.closest('button, a, summary, input, select, #pager')) return;
    swipe = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, on: false, pts: [] };
  });
  stage.addEventListener('pointermove', e => {
    if (!swipe || e.pointerId !== swipe.id) return;
    if (!swipe.on) {
      const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // vertical: not a swipe
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.5) return;              // not decided yet
      if (String(window.getSelection())) { swipe = null; return; }                    // extending a selection
      swipe.on = true; swipe.x0 = e.clientX; // follow from here, so the page doesn't jump by the slop
      stopTurn();
      try { stage.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
    }
    let d = e.clientX - swipe.x0;
    if ((page === 0 && d > 0) || (page >= pages - 1 && d < 0)) d *= 0.3; // nothing that way: resist
    swipe.dx = d;
    swipe.pts.push([e.timeStamp, e.clientX]);
    if (swipe.pts.length > 5) swipe.pts.shift();
    content.style.transform = `translateX(${stripX(page) + d}px)`;
  });
  const endSwipe = e => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const s = swipe;
    swipe = null;
    if (!s.on) return;
    swipedAt = Date.now();
    const p0 = s.pts[0], p1 = s.pts[s.pts.length - 1];
    const v = p0 && p1 && p1[0] > p0[0] ? (p1[1] - p0[1]) / (p1[0] - p0[0]) : 0; // px/ms over the last few moves
    const w = viewport.clientWidth;
    let dir = 0;
    if (e.type !== 'pointercancel') {
      if (s.dx < 0 && (s.dx < -w * 0.2 || v < -0.4)) dir = 1;       // dragged / flicked left: next page
      else if (s.dx > 0 && (s.dx > w * 0.2 || v > 0.4)) dir = -1;   // right: previous page
    }
    const from = stripX(page) + s.dx, target = Math.max(0, Math.min(pages - 1, page + dir));
    if (target !== page) setPage(target, false); // sets the final transform; the glide below starts from the finger
    else content.style.transform = `translateX(${stripX(page)}px)`;
    const end = stripX(target), dist = Math.abs(end - from);
    if (dist > 1 && !reduceMotion.matches) // ease-out cubic (a quick start that settles)
      tween(Math.min(280, 90 + dist / 3), k => { content.style.transform = `translateX(${from + (end - from) * (1 - (1 - k) ** 3)}px)`; });
  };
  stage.addEventListener('pointerup', endSwipe);
  stage.addEventListener('pointercancel', endSwipe);

  /* ---------------- auto-hiding bars (phones) ---------------- */
  // body.autohide (from autoMQ) makes the toolbar and scrub bar float over the text; body.chrome-hidden
  // slides them away. They hide when reading moves on (a page turn, scrolling down) and come back
  // with a tap in the middle of the page or scrolling up. While anything that hangs off them is in
  // use (Home, a drawer, a menu, search, a scrub drag, keyboard focus) they stay.
  let chromeHidden = false, tapClosedSomething = false, hintTimer = 0;
  const autoHiding = () => autoMQ.matches && !!doc;
  const chromeNeeded = () => !doc || searchOpen() || $('#toc').classList.contains('open') || scrubDragging
    || Object.values(panels).some(s => $(s).classList.contains('open'))
    || !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#toolbar, #scrubbar') && document.activeElement.matches(':focus-visible'));
  function setChrome(hidden) {
    hidden = !!hidden && autoHiding() && !chromeNeeded();
    if (hidden === chromeHidden) return;
    chromeHidden = hidden;
    document.body.classList.toggle('chrome-hidden', hidden);
    if (hidden) firstHideHint(); else hideHint();
  }
  function syncAutoHide() {
    document.body.classList.toggle('autohide', autoMQ.matches);
    if (!autoHiding()) setChrome(false);
  }
  // The first time the bars hide, say how to get them back (once per browser).
  function firstHideHint() {
    try { if (localStorage.getItem('reflower.chromeHint')) return; localStorage.setItem('reflower.chromeHint', '1'); } catch { return; }
    const h = $('#chromeHint');
    h.classList.add('show'); h.setAttribute('aria-hidden', 'false');
    hintTimer = setTimeout(hideHint, 4000);
  }
  function hideHint() { clearTimeout(hintTimer); $('#chromeHint').classList.remove('show'); $('#chromeHint').setAttribute('aria-hidden', 'true'); }
  // A tap that closes a menu or drawer shouldn't also toggle the bars: note what was open before it.
  document.addEventListener('pointerdown', () => {
    tapClosedSomething = $('#toc').classList.contains('open') || Object.values(panels).some(s => $(s).classList.contains('open'));
    hideHint();
  }, true);
  // Keyboard and screen-reader users: focus reaching a hidden bar (or Tab) brings it back.
  document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('#toolbar, #scrubbar') && e.target.matches(':focus-visible')) setChrome(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Tab') setChrome(false); }, true);
  autoMQ.addEventListener('change', () => { syncAutoHide(); scheduleRelayout(); });

  /* ---------------- drag & drop / paste ---------------- */
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });
  document.addEventListener('paste', e => {
    if (e.target.closest('input, textarea')) return;
    const t = e.clipboardData.getData('text/plain');
    if (t && t.trim()) { e.preventDefault(); openSource(t, 'Pasted text'); }
  });

  applySettings();
  syncAutoHide();
  relayout(null);
  showRecent();
  window.ReflowerApp = { loadText, setLayout, setView, setPage, resolveFonts, get fonts() { buildFontMenu(); return fontMenu; }, get state() { return { page, pages, view, layout: S.layout, doc, chromeHidden, search: { q: SR.q, total: SR.total, shown: SR.hits.length, cur: SR.cur, done: SR.done } }; } };
})();
</script>
</body>
</html>
