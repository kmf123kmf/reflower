<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Reflower UI smoke test</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}#out{position:fixed;left:0;bottom:0;background:#ffe;font:11px monospace;max-width:50%;white-space:pre-wrap;z-index:9;display:none}</style>
</head>
<body>
<pre id="out"></pre>
<iframe id="f" src="../index.html"></iframe>
<script>
// Usage: /tests/ui.html?sample=gutenberg_72.txt&layout=spread&page=2&view=reflow&debug=1&show=1
// Headless: chrome --headless --screenshot=x.png --window-size=1400,900 <url>   or  --dump-dom to read #out
// Phones: add &w=390&h=844 (see below); every run prints a "fit" line flagging anything cut off sideways.
// &fonts=1 lists the font menu (here and simulated macOS / Linux). &toc=<n> clicks the nth Contents entry. &scrub=<range value> (a page in Page / Spread, 0-1000 along the book in Scroll) / &hover=<0..1> drive the scrub bar.
// &restore=1 reloads the app with a book open (should reopen at the same page) and after Home (should stay Home).
// &search=<text>[&next=N] types into the search panel and presses Enter N times. Add Chrome's
// --force-prefers-reduced-motion: headless virtual time can leave a page-turn animation on its first frame.
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
// &w=390&h=844 sizes the app's frame: headless Chrome will not make a window narrower than 500px,
// so phone widths are tested this way (the app's media queries follow the frame).
if (q.get('w')) Object.assign(f.style, { width: q.get('w') + 'px', height: (q.get('h') || 800) + 'px' });
let reloading = false; // &restore=1 reloads the frame itself
f.addEventListener('load', async () => {
  if (reloading) return;
  const w = f.contentWindow, app = w.ReflowerApp, out = [];
  try {
    const name = q.get('sample') || 'gutenberg_72.txt';
    const blob = await (await fetch('../samples/' + name)).blob();
    // exercise the real drag & drop path (file decoding, RTF detection)
    const dt = new w.DataTransfer();
    dt.items.add(new w.File([blob], name.split('/').pop()));
    w.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
    // (by name: the book open when the app was last left may reopen first)
    for (let n = 0; n < 50 && !(app.state.doc && app.state.doc.name === name.split('/').pop()); n++) await new Promise(r => setTimeout(r, 20));
    if (q.get('debug')) w.document.getElementById('btnDebug').click();
    for (const l of ['page', 'spread', 'scroll']) {
      app.setLayout(l);
      const st = app.state;
      out.push(`${l}: pages=${st.pages}`);
    }
    app.setLayout('page'); app.setPage(4);
    const before = w.document.caretRangeFromPoint ? 'caret ok' : 'no caret api';
    app.setLayout('spread');
    out.push(`page4 in page-layout -> spread page ${app.state.page} (${before})`);
    app.setLayout('page');
    out.push(`back to page layout -> page ${app.state.page}`);
    app.setView('raw'); out.push(`raw rows=${w.document.querySelectorAll('.rl').length}`);
    app.setView('reflow');
    app.setLayout(q.get('layout') || 'scroll');
    if (q.get('view')) app.setView(q.get('view'));
    if (q.get('page')) app.setPage(+q.get('page'), false);
    out.push(`final: ${JSON.stringify({ page: app.state.page, pages: app.state.pages, view: app.state.view, layout: app.state.layout })}`);
    { // nothing should stick out sideways, at any window size (phones especially)
      const d = w.document, tb = d.getElementById('toolbar'), vis = el => el.getClientRects().length > 0;
      const cut = [...tb.querySelectorAll('button, #indicator')].filter(vis).filter(el => el.getBoundingClientRect().right > w.innerWidth + 0.5).map(el => el.id || el.dataset.layout || el.dataset.view);
      const pr = d.getElementById('pane').getBoundingClientRect(), vr = d.getElementById('viewport').getBoundingClientRect();
      out.push(`fit @${w.innerWidth}px: toolbar ${cut.length ? 'CUT OFF: ' + cut.join(',') : 'all visible'}; pane ${Math.round(pr.left)}-${Math.round(pr.right)}; text ${Math.round(vr.left)}-${Math.round(vr.right)} (${Math.round(vr.width)}px)${pr.right > w.innerWidth + 0.5 || pr.left < -0.5 ? ' OVERFLOWS' : ''}`);
      // can the reading area be dragged sideways? (it can if anything in it pokes out past its edges)
      const stg = d.getElementById('stage'), sr = stg.getBoundingClientRect();
      const poke = [...stg.querySelectorAll('*')].filter(el => { const r = el.getBoundingClientRect(); return r.width && (r.right > sr.right + 0.5 || r.left < sr.left - 0.5); })
        .slice(0, 6).map(el => `${el.tagName.toLowerCase()}${el.id ? '#' + el.id : el.className && typeof el.className === 'string' ? '.' + el.className.split(' ')[0] : ''}`);
      out.push(`sideways: stage scrollWidth ${stg.scrollWidth} vs ${stg.clientWidth} (overflow-x ${getComputedStyle(stg).overflowX})${poke.length ? '; poking out: ' + poke.join(', ') : ''}`);
    }
    if (q.get('fonts')) { // the font menu here, and as it would be with typical macOS / Linux fonts
      const menu = fs => fs.map(f => `${f.id}=${f.label}`).join(', ');
      out.push(`fonts here: ${menu(app.fonts)}; in use: ${getComputedStyle(w.document.documentElement).getPropertyValue('--font')}`);
      const sim = { macOS: 'Iowan Old Style,Charter,Palatino,Georgia,San Francisco,Gill Sans,Avenir Next,Lucida Grande,Helvetica Neue,Verdana,Trebuchet MS,Menlo,Geneva',
        iPhone: 'Iowan Old Style,Charter,Palatino,Georgia,San Francisco,Gill Sans,Avenir Next,Helvetica Neue,Verdana,Trebuchet MS,Menlo',
        'Ubuntu': 'Noto Serif,Noto Sans,Noto Sans Mono,DejaVu Serif,DejaVu Sans,DejaVu Sans Mono,Liberation Serif,Liberation Sans,Liberation Mono,P052,Ubuntu',
        'Fedora + LibreOffice': 'Noto Serif,Noto Sans,Noto Sans Mono,DejaVu Sans,Liberation Serif,Carlito,Cantarell' };
      for (const [os, list] of Object.entries(sim)) { const has = new Set(list.split(',')); out.push(`fonts ${os}: ${menu(app.resolveFonts(f => has.has(f)))}`); }
      const sel = w.document.getElementById('setFont'), pick = [...sel.options].find(o => o.value !== sel.value);
      out.push(`menu: ${[...sel.options].map(o => o.textContent).join(' | ')}; selected ${sel.value}`);
      sel.value = pick.value; sel.dispatchEvent(new w.Event('input', { bubbles: true }));
      out.push(`picked ${pick.textContent} -> --font ${getComputedStyle(w.document.documentElement).getPropertyValue('--font')}; menu shown in ${getComputedStyle(sel).fontFamily}; options in ${[...sel.options].slice(0, 3).map(o => getComputedStyle(o).fontFamily).join(' | ')}`);
    }
    if (q.get('toc')) { // click the Nth Contents entry
      const d = w.document, link = d.querySelectorAll('#tocList a')[+q.get('toc')];
      d.getElementById('tocTab').click(); await new Promise(r => setTimeout(r, 300));
      out.push(`contents drawer ${d.getElementById('toc').classList.contains('open') ? 'opened' : 'DID NOT OPEN'} from its tab`);
      link.click(); await new Promise(r => setTimeout(r, 400));
      out.push(`after picking: drawer ${d.getElementById('toc').classList.contains('open') ? 'STILL OPEN' : 'closed'}`);
      const h = d.getElementById(link.dataset.id).getClientRects()[0], v = d.getElementById('viewport').getBoundingClientRect(), st = d.getElementById('stage').getBoundingClientRect();
      out.push(`toc "${link.textContent}" -> page ${app.state.page}, heading ${h.left >= v.left - 1 && h.right <= v.right + 1 && h.top >= st.top && h.bottom <= st.bottom ? 'visible' : 'NOT VISIBLE'} (y=${Math.round(h.top - st.top)})`);
    }
    if (q.get('scrub') || q.get('hover')) { // the scrub bar: &scrub=<range value> drags to it, &hover=<0..1> hovers
      const d = w.document, r = d.getElementById('scrubRange'), tip = d.getElementById('scrubTip');
      out.push(`scrub: max=${r.max} value=${r.value} ticks=${d.querySelectorAll('#scrubTicks i').length}`);
      if (q.get('scrub')) { r.value = q.get('scrub'); r.dispatchEvent(new w.Event('input', { bubbles: true })); out.push(`scrubbed -> page ${app.state.page} scrollTop ${Math.round(d.getElementById('stage').scrollTop)}; tip "${tip.textContent}"`);
        await new Promise(res => setTimeout(res, 400)); out.push(`readout "${d.getElementById('indicator').textContent}"`); }
      if (q.get('hover')) { const b = r.getBoundingClientRect(); r.dispatchEvent(new w.PointerEvent('pointermove', { clientX: b.left + 7 + +q.get('hover') * (b.width - 14), clientY: b.top + b.height / 2, bubbles: true })); out.push(`hover tip "${tip.textContent}" (page still ${app.state.page})`); }
    }
    if (q.get('search')) { // type into the search panel like a reader, then press Enter (&next=N presses it N times)
      const d = w.document, inp = d.getElementById('searchInput');
      const paneBox = () => { const r = d.getElementById('pane').getBoundingClientRect(); return `${Math.round(r.left)}-${Math.round(r.right)}`; }, pane0 = paneBox();
      d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key: '/', bubbles: true }));
      inp.value = q.get('search');
      inp.dispatchEvent(new w.Event('input', { bubbles: true }));
      const t0 = performance.now();
      for (let n = 0; n < 500 && !(app.state.search.q && app.state.search.done); n++) await new Promise(r => setTimeout(r, 20));
      const before = app.state.page;
      out.push(`pane ${pane0} -> ${paneBox()} with the panel open (panel from ${Math.round(d.getElementById('search').getBoundingClientRect().left)})`);
      for (let n = +(q.get('next') || 1); n > 0; n--) inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      if (q.get('tap')) { // &tap=N then taps the Nth result row, as on a phone
        await new Promise(r => setTimeout(r, 300));
        d.querySelectorAll('#searchList .hit')[+q.get('tap')].click();
        out.push(`tapped row ${q.get('tap')}; keyboard ${d.activeElement === inp ? 'STILL UP (input focused)' : 'dismissed'}`);
        if (q.get('dbl')) { // &dbl=1: tap the same row again straight away (a double tap closes the sheet on phones)
          const hc = w.CSS.highlights.get('search-cur'), range = hc && [...hc][0];
          await new Promise(r => setTimeout(r, 150));
          d.querySelectorAll('#searchList .hit')[+q.get('tap')].click();
          d.getAnimations().forEach(a => a.finish());
          const r = range && range.getClientRects()[0], st = d.getElementById('stage').getBoundingClientRect(), v = d.getElementById('viewport').getBoundingClientRect();
          // floating bars (auto-hide) cover the text where they show
          const bar = id => { const el = d.getElementById(id); return el && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden' && +getComputedStyle(el).opacity > 0.1 ? el.getBoundingClientRect() : null; };
          const tb = bar('toolbar'), sb = bar('scrubbar');
          const top = Math.max(st.top, v.top, tb && tb.bottom <= st.top + st.height / 2 ? tb.bottom : -1e9), bottom = Math.min(st.bottom, v.bottom, sb && sb.top >= st.top + st.height / 2 ? sb.top : 1e9);
          out.push(`double tap: panel ${app.state.search && d.getElementById('search').classList.contains('open') ? 'STILL OPEN' : 'closed'}; match ${r && r.top >= top - 2 && r.bottom <= bottom + 2 && r.left >= v.left - 1 && r.right <= v.right + 1 ? 'still visible' : 'NOT VISIBLE'} (y=${r ? Math.round(r.top) : '?'}; uncovered text area y ${Math.round(top)}-${Math.round(bottom)})`);
        }
      }
      await new Promise(r => setTimeout(r, 400)); // let the page turn finish
      const s = app.state.search;
      out.push(`search "${s.q}": total=${s.total} shown=${s.shown} cur=${s.cur} done=${s.done} in ${Math.round(performance.now() - t0)}ms; page ${before} -> ${app.state.page}`);
      out.push(`status: ${d.getElementById('searchStatus').textContent}`);
      const hc = w.CSS.highlights && w.CSS.highlights.get('search-cur'), cr = hc && [...hc][0];
      if (cr) { d.getAnimations().forEach(a => a.finish());
        const r = cr.getClientRects()[0], v = d.getElementById('viewport').getBoundingClientRect(), sv = d.getElementById('stage').getBoundingClientRect();
        const sp = d.getElementById('search').getBoundingClientRect(), under = sp.width >= w.innerWidth - 1 && r.top < sp.bottom; // a full-width sheet covering it
        const top = Math.max(v.top, sv.top), bottom = Math.min(v.bottom, sv.bottom);
        out.push(`current match ${r && !under && r.left <= v.right && r.right >= v.left && r.top >= top && r.bottom <= bottom ? 'visible' : 'NOT VISIBLE'} (x=${Math.round(r.left)} y=${Math.round(r.top)}; text area x ${Math.round(v.left)}-${Math.round(v.right)} y ${Math.round(top)}-${Math.round(bottom)}; search panel y ${Math.round(sp.top)}-${Math.round(sp.bottom)})`); }
      const row = d.querySelector('#searchList .hit.cur');
      out.push(`current row: ${row ? row.textContent : '(none)'}`);
    }
    if (q.get('chrome')) { // &chrome=1: auto-hiding bars (phones). Taps as a reader would; page breaks must not move.
      const d = w.document, st = d.getElementById('stage'), vp = d.getElementById('viewport');
      const settle = async () => { await new Promise(r => setTimeout(r, 50)); d.getAnimations().forEach(a => a.finish()); };
      const tap = async fx => { const r = vp.getBoundingClientRect(); d.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true }));
        st.dispatchEvent(new w.MouseEvent('click', { bubbles: true, clientX: r.left + fx * r.width, clientY: r.top + r.height / 2 })); await settle(); };
      const bars = () => { const t = d.getElementById('toolbar').getBoundingClientRect(), s = d.getElementById('scrubbar').getBoundingClientRect();
        return `${app.state.chromeHidden ? 'hidden' : 'shown'} (toolbar bottom ${Math.round(t.bottom)} opacity ${getComputedStyle(d.getElementById('toolbar')).opacity}, scrub top ${Math.round(s.top)}/${w.innerHeight})`; };
      const geo = () => `${app.state.pages} pages, text ${Math.round(vp.getBoundingClientRect().height)}px tall`;
      app.setLayout('page'); app.setPage(1, false); await settle();
      out.push(`chrome: autohide ${d.body.classList.contains('autohide') ? 'on' : 'off'}; after the first page turn: bars ${bars()}; hint ${d.getElementById('chromeHint').classList.contains('show') ? 'shown' : 'not shown'}; ${geo()}`);
      app.setPage(0, false); await tap(0.9); out.push(`tap right edge -> page ${app.state.page}; bars ${bars()}; ${geo()}; hint ${d.getElementById('chromeHint').classList.contains('show') ? 'still shown' : 'dismissed'}`);
      await tap(0.5); out.push(`tap middle -> page ${app.state.page}; bars ${bars()}; ${geo()}`);
      await tap(0.5); out.push(`tap middle again -> bars ${bars()}`);
      d.body.dispatchEvent(new w.KeyboardEvent('keydown', { key: 't', bubbles: true })); await settle();
      out.push(`Contents (T) -> bars ${bars()}`);
      await tap(0.5); out.push(`tap to close Contents -> drawer ${d.getElementById('toc').classList.contains('open') ? 'open' : 'closed'}, bars ${bars()}`);
      app.setPage(app.state.page + 1); await settle(); out.push(`page turn -> bars ${bars()}`);
      d.getElementById('btnSearchTb').click(); await settle(); out.push(`search opened -> bars ${bars()}`);
      app.setPage(app.state.page + 1); await settle(); out.push(`page turn with search open -> bars ${bars()}`);
      d.getElementById('searchClose').click(); await settle();
      app.setLayout('scroll'); await settle();
      st.scrollTop += 300; st.dispatchEvent(new w.Event('scroll')); await settle(); out.push(`scroll down 300 -> bars ${bars()}`);
      st.scrollTop -= 100; st.dispatchEvent(new w.Event('scroll')); await settle(); out.push(`scroll up 100 -> bars ${bars()}`);
      st.scrollTop += 10; st.dispatchEvent(new w.Event('scroll')); await settle(); out.push(`scroll down 10 -> bars ${bars()}`);
    }
    if (q.get('swipe')) { // &swipe=1: touch drags on the page (Page layout), as a finger would
      const d = w.document, st = d.getElementById('stage'), ct = d.getElementById('content'), vp = d.getElementById('viewport');
      const wait = ms => new Promise(r => setTimeout(r, ms));
      const offset = () => { const m = getComputedStyle(ct).transform.match(/matrix\(([^)]+)\)/); return m ? Math.round(+m[1].split(',')[4]) : 0; };
      const ev = (type, x, y) => st.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 7, pointerType: 'touch', isPrimary: true, clientX: x, clientY: y }));
      // drag from fx0 to fx1 (fractions of the window width) in `steps` moves `ms` apart; reports the mid-drag offset
      const drag = async (fx0, fx1, steps, ms, fy1 = 0) => {
        const W = w.innerWidth, y = vp.getBoundingClientRect().top + 200, base = offset();
        ev('pointerdown', fx0 * W, y); let mid = null;
        for (let k = 1; k <= steps; k++) { await wait(ms); ev('pointermove', (fx0 + (fx1 - fx0) * k / steps) * W, y + fy1 * k / steps); if (k === Math.ceil(steps / 2)) mid = offset() - base; }
        ev('pointerup', fx1 * W, y + fy1);
        st.dispatchEvent(new w.MouseEvent('click', { bubbles: true, clientX: fx1 * W, clientY: y })); // the tap a lift would also produce
        await wait(400); d.getAnimations().forEach(a => a.finish());
        return mid;
      };
      app.setLayout('page'); app.setPage(2, false); await wait(100);
      const res = (label, p0, mid) => out.push(`swipe ${label}: page ${p0} -> ${app.state.page}${mid != null ? `; mid-drag the page moved ${mid}px` : ''}; strip at ${offset()}px; bars ${app.state.chromeHidden ? 'hidden' : 'shown'}`);
      let p0 = app.state.page, mid = await drag(0.7, 0.3, 8, 40); res('left 40% slowly', p0, mid);
      p0 = app.state.page; mid = await drag(0.6, 0.5, 6, 40); res('left 10% slowly (springs back)', p0, mid);
      p0 = app.state.page; mid = await drag(0.6, 0.45, 3, 8); res('quick flick left 15%', p0, mid);
      p0 = app.state.page; mid = await drag(0.3, 0.7, 8, 40); res('right 40% slowly', p0, mid);
      app.setPage(0, false); await wait(50);
      p0 = app.state.page; mid = await drag(0.3, 0.8, 8, 40); res('right on the first page (resists)', p0, mid);
      p0 = app.state.page; mid = await drag(0.03, 0.6, 8, 40); res('from the screen edge (left to Safari)', p0, mid);
      p0 = app.state.page; mid = await drag(0.5, 0.45, 8, 40, 200); res('mostly vertical', p0, mid);
    }
    if (q.get('hist')) { // &hist=1: Home and the browser's Back / Forward
      const d = w.document, wait = ms => new Promise(r => setTimeout(r, ms));
      out.push(`history: open book -> state ${JSON.stringify(w.history.state)}`);
      d.getElementById('btnHome').click(); await wait(500);
      out.push(`Home button -> ${app.state.doc ? 'STILL IN BOOK' : 'home'}; state ${JSON.stringify(w.history.state)}`);
      w.history.forward(); await wait(800);
      out.push(`Forward -> ${app.state.doc ? 'reopened ' + app.state.doc.name : 'STILL HOME'}`);
      w.history.back(); await wait(500);
      out.push(`Back -> ${app.state.doc ? 'STILL IN BOOK' : 'home'}`);
      // books opened over a book (another file, then an edited copy of it) stack up for Back, Home goes
      // all the way Home, and the edited copy replaces the older one in Recent (same name)
      const drop = async (text, fname) => {
        const dt = new w.DataTransfer(); dt.items.add(new w.File([text], fname));
        w.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
        for (let n = 0; n < 50 && !(app.state.doc && app.state.doc.text.startsWith(text.slice(0, 40))); n++) await wait(20);
      };
      const txt = await blob.text(), len0 = w.history.length;
      await drop(txt, name.split('/').pop()); await drop('Other book.\n\nA second file.\n', 'other.txt');
      await drop('Edited.\n\n' + txt, name.split('/').pop()); await wait(300);
      await drop('Edited.\n\n' + txt, name.split('/').pop()); await wait(300); // same book again: no new step
      out.push(`3 books opened over each other (+ one reopened): history length ${w.history.length} (was ${len0}, want +2), depth ${w.history.state.depth}`);
      w.history.back(); await wait(800);
      out.push(`Back -> ${app.state.doc ? app.state.doc.name : 'HOME'} (want other.txt)`);
      d.getElementById('btnHome').click(); await wait(800);
      out.push(`then Home button -> ${app.state.doc ? 'STILL IN BOOK ' + app.state.doc.name : 'home'}; state ${JSON.stringify(w.history.state)}`);
      w.history.forward(); await wait(800);
      for (let n = 0; n < 100 && !app.state.doc; n++) await wait(20);
      out.push(`Forward -> ${app.state.doc ? app.state.doc.name : "HOME"} (want gutenberg_72.txt); state ${JSON.stringify(w.history.state)}`);
      const recs = await new Promise(r => { const o = w.indexedDB.open('reflower', 1); o.onsuccess = () => { const g = o.result.transaction('files').objectStore('files').getAll(); g.onsuccess = () => r(g.result); }; });
      const names = recs.map(x => x.name), dup = names.filter((x, i) => names.indexOf(x) !== i);
      out.push(`Recent: ${names.join(', ')}${dup.length ? ' - DUPLICATE ' + dup.join(', ') : ''}`);
    }
    if (q.get('restore')) { // &restore=1: leaving with a book open reopens it on return; leaving from Home doesn't
      const wait = ms => new Promise(r => setTimeout(r, ms));
      const reload = async () => {
        reloading = true;
        const loaded = new Promise(r => f.addEventListener('load', r, { once: true }));
        f.contentWindow.location.reload(); await loaded; reloading = false;
        const a = f.contentWindow.ReflowerApp;
        for (let n = 0; n < 250 && !a.state.doc; n++) await wait(20); // IndexedDB runs in real time, not virtual
        return f.contentWindow;
      };
      app.setLayout('page'); app.setPage(3, false); await wait(600); // positions save after 400 ms
      const pg = app.state.page;
      let w2 = await reload(), st = w2.ReflowerApp.state;
      out.push(`restore: reload while reading -> ${st.doc ? `reopened ${st.doc.name} at page ${st.page} (was ${pg})` : 'HOME (NOT RESTORED)'}; state ${JSON.stringify(w2.history.state)}, history length ${w2.history.length}`);
      if (st.doc) { w2.document.getElementById('btnHome').click(); await wait(500); }
      w2 = await reload(); st = w2.ReflowerApp.state;
      out.push(`restore: reload after Home -> ${st.doc ? 'REOPENED ' + st.doc.name : 'home'}`);
      out.push(`restore: storage persisted = ${await w2.navigator.storage.persisted()}`);
    }
    if (q.get('click')) { // &click=id[,id…] clicks toolbar/panel controls in turn, then reports what is open
      const d = w.document;
      for (const id of q.get('click').split(',')) { d.getElementById(id).click(); await new Promise(r => setTimeout(r, 300)); }
      d.getAnimations().forEach(a => a.finish()); // headless virtual time can leave a drawer mid-slide
      const open = [...d.querySelectorAll('.panel.open, #toc.open, #search.open')].map(el => { const r = el.getBoundingClientRect(); return `${el.id} ${Math.round(r.left)}-${Math.round(r.right)}${r.right > w.innerWidth + 0.5 || r.left < -0.5 ? ' OVERFLOWS' : ''}`; });
      out.push(`after clicking ${q.get('click')}: open = ${open.join('; ') || '(nothing)'}`);
      const sx = [d.documentElement, d.body, ...d.querySelectorAll('#search, #search *, #stage')].filter(el => el.scrollLeft).map(el => `${el.id || el.tagName}:${el.scrollLeft}`);
      if (sx.length) out.push(`scrolled sideways: ${sx.join(', ')}`);
    }
  } catch (e) { out.push('ERROR ' + e.stack); }
  const o = document.getElementById('out');
  o.textContent = out.join('\n');
  if (q.get('show')) o.style.display = 'block';
});
</script>
</body>
</html>
